<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Buku Saku Digital - Premium Edition</title>
    
    <meta name="theme-color" content="#022c22">
    <link rel="apple-touch-icon" href="./icon-512.png">
    
    <link rel="preload" href="./logo.png" as="image">
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Amiri:wght@400;700&family=Lateef:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], serif: ['Playfair Display', 'serif'], arabic: ['Amiri', 'serif'] },
                    colors: { royal: { dark: '#022c22', base: '#064e3b' }, gold: { 400: '#facc15', 500: '#eab308' } }
                }
            }
        }
    </script>
    <style>
        html, body {
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            position: fixed; 
            top: 0; left: 0;
            overflow: hidden; 
            background: radial-gradient(ellipse at top, #064e3b, #022c22, #000000); 
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent; 
        }

        .app-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            max-width: 28rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none; 
            flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
        }
        .page.active { display: flex; }

        .header-fixed {
            flex: 0 0 auto; 
            width: 100%;
            background: rgba(2, 44, 34, 0.95);
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        .content-scroll {
            flex: 1 1 auto; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding: 1.5rem; 
            padding-bottom: 20vh; 
            scroll-behavior: smooth;
        }

        .editor-box { outline: none; min-height: 100%; }
        .editor-box[contenteditable="true"] {
            -webkit-user-select: text;
            user-select: text;
        }
        .editor-box[contenteditable="true"]:focus { 
            border: 1px dashed rgba(234, 179, 8, 0.5); 
            border-radius: 8px; padding: 8px; background: rgba(255,255,255,0.02); 
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }
    </style>
</head>
<body class="selection:bg-gold-500 selection:text-royal-dark font-sans relative">

    <div class="app-wrapper">
        <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-royal-dark border border-gold-500 text-gold-400 px-6 py-2 rounded-full shadow-lg z-[1000] opacity-0 pointer-events-none transition-opacity duration-300 font-semibold text-sm">Pesan</div>

        <div id="install-banner" class="fixed bottom-0 left-0 w-full bg-royal-dark/95 backdrop-blur border-t border-gold-500/50 p-4 hidden flex-row justify-between items-center z-[2000] shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
            <div class="flex items-center gap-3">
                <img src="./icon-192.png" onerror="this.src='./logo.png'" alt="Icon" class="w-12 h-12 rounded-xl shadow-md border border-gold-500/30">
                <div>
                    <p class="text-gold-400 font-bold text-[15px] leading-tight">Buku Saku Digital</p>
                    <p class="text-xs text-slate-300 mt-0.5">Install aplikasi ke perangkat Anda</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-install" class="bg-gradient-to-r from-gold-500 to-gold-400 text-black px-4 py-2 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform">Install</button>
                <button onclick="document.getElementById('install-banner').classList.replace('flex','hidden')" class="text-slate-400 p-2 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div id="custom-modal" class="fixed inset-0 bg-black/80 z-[1000] hidden items-center justify-center px-4 backdrop-blur-sm">
            <div class="bg-royal-dark border border-gold-500/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <h3 id="modal-title" class="text-xl font-serif text-gold-400 mb-4">Judul</h3>
                
                <div class="relative w-full mb-6" id="modal-input-container">
                    <input type="text" id="modal-input" class="w-full px-4 py-3 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white focus:border-gold-400">
                    <button id="modal-eye-btn" class="absolute right-4 top-3.5 text-slate-400 hidden" onclick="toggleModalPassword()"><i class="fas fa-eye-slash" id="modal-eye-icon"></i></button>
                </div>

                <div class="relative w-full mb-6 hidden" id="modal-select-container">
                    <select id="modal-select" class="w-full px-4 py-3 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white focus:border-gold-400">
                        <option value="1">Ting (Sistem Default)</option>
                        <option value="2">Bloop (Nada Pendek)</option>
                        <option value="3">Chime (Melodi Cantik)</option>
                        <option value="0">Hening (Tanpa Suara)</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:text-white">Batal</button>
                    <button id="btn-modal-confirm" class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-400 text-black font-bold rounded-lg shadow-md">Simpan</button>
                </div>
            </div>
        </div>

        <!-- MODAL JADWAL PENGAJIAN -->
        <div id="schedule-modal" style="display:none;" class="fixed inset-0 bg-black/80 z-[1000] items-center justify-center px-4 backdrop-blur-sm">
            <div class="bg-royal-dark border border-gold-500/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                <h3 id="schedule-modal-title" class="text-xl font-serif text-gold-400 mb-4">Tambah Jadwal Pengajian</h3>
                
                <div class="space-y-3 mb-6">
                    <div>
                        <label class="block text-xs text-gold-400/80 mb-1">Hari / Tanggal</label>
                        <input type="text" id="sched-day" placeholder="Contoh: Setiap Malam Jumat / 26 Nov 2026" class="w-full px-3 py-2.5 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white text-sm focus:border-gold-400">
                    </div>
                    <div>
                        <label class="block text-xs text-gold-400/80 mb-1">Jam Mulai</label>
                        <input type="text" id="sched-time" placeholder="Contoh: 19:30 WIB (Ba'da Isya)" class="w-full px-3 py-2.5 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white text-sm focus:border-gold-400">
                    </div>
                    <div>
                        <label class="block text-xs text-gold-400/80 mb-1">Tempat / Lokasi Pengajian</label>
                        <input type="text" id="sched-location" placeholder="Contoh: Musholla Al-Ikhlas / Rumah Bpk. Ahmad" class="w-full px-3 py-2.5 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white text-sm focus:border-gold-400">
                    </div>
                    <div>
                        <label class="block text-xs text-gold-400/80 mb-1">Agenda Acara</label>
                        <textarea id="sched-agenda" rows="3" placeholder="Contoh: Pembacaan Manaqib, Yasin, Tahlil & Doa Bersama" class="w-full px-3 py-2.5 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white text-sm focus:border-gold-400 resize-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button onclick="closeScheduleModal()" class="px-4 py-2 text-slate-400 hover:text-white">Batal</button>
                    <button onclick="saveScheduleForm()" class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-400 text-black font-bold rounded-lg shadow-md">Simpan</button>
                </div>
            </div>
        </div>

        <div id="image-modal" class="fixed inset-0 bg-black/95 z-[3000] hidden flex-col items-center justify-center p-2 backdrop-blur-md transition-opacity" onclick="closeImageModal()">
            <button class="absolute top-6 right-6 text-slate-300 hover:text-white text-3xl"><i class="fas fa-times"></i></button>
            <img id="image-modal-img" src="" class="max-w-full max-h-full object-contain rounded-xl border border-gold-500/30 shadow-[0_0_30px_rgba(234,179,8,0.2)]">
        </div>

        <!-- HALAMAN 1: COVER -->
        <div id="page-cover" class="page active relative px-6">
            <div class="flex-grow w-full flex items-center justify-center pt-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-gold-500 blur-[40px] opacity-25 rounded-full scale-110"></div>
                    <img src="./logo.png" alt="Logo" class="w-44 h-44 object-cover relative z-10 rounded-full border-2 border-gold-500/50 shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                </div>
            </div>
            
            <div class="flex-none flex flex-col items-center justify-center pb-24 w-full relative z-20 text-center">
                <div class="relative flex items-center justify-center mb-4">
                    <h1 id="cover-title" class="text-5xl font-serif font-bold text-gold-400 tracking-wide drop-shadow-md">Buku Saku</h1>
                    <button onclick="editCoverData('title')" class="cover-edit-icon hidden absolute -right-8 top-1 bg-royal-dark border border-gold-500/50 w-7 h-7 rounded-full shadow-md items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-black">
                        <i class="fas fa-pen text-[10px]"></i>
                    </button>
                </div>

                <div class="flex items-center gap-3 mb-4">
                    <div class="h-px w-12 bg-gradient-to-r from-transparent to-gold-500"></div>
                    <i class="fas fa-gem text-gold-500 text-[10px]"></i>
                    <div class="h-px w-12 bg-gradient-to-l from-transparent to-gold-500"></div>
                </div>
                
                <div class="relative flex items-center justify-center mb-10">
                    <h2 id="cover-subtitle" class="text-xs text-slate-300 tracking-[0.2em] uppercase">Ngopsin Mabu Park</h2>
                    <button onclick="editCoverData('subtitle')" class="cover-edit-icon hidden absolute -right-8 -top-1.5 bg-royal-dark border border-gold-500/50 w-6 h-6 rounded-full shadow-md items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-black">
                        <i class="fas fa-pen text-[10px]"></i>
                    </button>
                </div>
                
                <div class="relative flex flex-col items-center gap-3">
                    <div class="relative mb-2">
                        <button onclick="navigateTo('page-toc')" class="border border-gold-500 text-gold-400 font-serif italic py-3 px-10 rounded-full hover:bg-gold-500 hover:text-black transition-colors flex items-center gap-3 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                            <span id="cover-btnText">Buka Kitab</span> <i class="fas fa-book-open text-sm"></i>
                        </button>
                        <button onclick="editCoverData('btnText')" class="cover-edit-icon hidden absolute -top-3 -right-3 bg-royal-dark border border-gold-500 w-8 h-8 rounded-full shadow-md items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-black">
                            <i class="fas fa-pen text-xs"></i>
                        </button>
                    </div>
                    
                    <button onclick="openChat()" class="relative text-gold-500/70 hover:text-gold-400 font-serif italic text-sm flex items-center gap-2 transition-colors px-4 py-1.5">
                        <i class="fas fa-comments"></i> Ruang Obrolan
                        <span id="chat-badge" class="hidden absolute -top-1.5 -right-3 bg-red-600 text-white text-[9px] font-sans font-bold px-1.5 py-0.5 rounded-full shadow-md border border-royal-dark min-w-[20px] items-center justify-center">0</span>
                    </button>

                    <button onclick="openSchedule()" class="relative text-gold-500/70 hover:text-gold-400 font-serif italic text-sm flex items-center gap-2 transition-colors px-4 py-1.5">
                        <i class="fas fa-calendar-alt"></i> Jadwal Pengajian
                    </button>
                </div>
            </div>

            <div class="absolute bottom-8 w-full text-center z-20 left-0">
                <button onclick="promptAdminLogin()" class="p-3 text-slate-600 hover:text-gold-500 transition-colors">
                    <i id="admin-icon" class="fas fa-lock text-sm"></i>
                </button>
            </div>
        </div>

        <!-- HALAMAN 2: DAFTAR ISI -->
        <div id="page-toc" class="page">
            <div class="header-fixed p-4 flex justify-between items-center">
                <button onclick="window.history.back()" class="text-gold-500 text-xl"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-serif font-bold text-gold-400 tracking-widest">DAFTAR ISI</h1>
                <div class="w-6"></div>
            </div>
            <div class="content-scroll p-6 pb-20">
                
                <div class="flex gap-3 mb-6 items-center w-full">
                    <div class="relative flex-grow">
                        <input type="text" id="search-input" oninput="handleSearch(event)" placeholder="Cari judul..." class="w-full bg-black/40 border border-gold-500/30 text-gold-400 text-sm rounded-full px-4 py-2.5 outline-none focus:border-gold-500 transition-colors">
                        <i class="fas fa-search absolute right-4 top-3 text-gold-500/50 text-sm"></i>
                    </div>
                    <button id="btn-reorder-mode" onclick="toggleReorderMode()" class="bg-royal-dark text-gold-500 border border-gold-500/50 rounded-full px-4 py-2.5 shadow-md text-sm whitespace-nowrap transition-colors"><i class="fas fa-sort mr-1"></i>Susun</button>
                    <button id="btn-add-toc" onclick="promptNewToc()" class="hidden bg-gold-500 text-black font-bold rounded-full px-4 py-2.5 shadow-md text-sm whitespace-nowrap"><i class="fas fa-plus mr-1"></i>Tambah</button>
                </div>

                <div id="toc-container" class="space-y-3">
                    <div class="text-center text-gold-500 py-10 font-serif animate-pulse">Memuat...</div>
                </div>
            </div>
        </div>

        <!-- HALAMAN 3: KONTEN (BACA & EDIT) -->
        <div id="page-detail" class="page">
            
            <div class="header-fixed">
                <div class="flex justify-between items-center p-3 border-b border-gold-500/20">
                    <button onclick="window.history.back()" class="text-gold-400 text-xl px-2"><i class="fas fa-arrow-left"></i></button>
                    <h1 id="detail-title" class="font-serif font-bold text-gold-400 truncate max-w-[200px]" ondblclick="if(isAdmin) promptEditTitle()">Judul</h1>
                    <button id="btn-edit-mode" onclick="toggleEditor()" class="text-slate-500 hidden px-2"><i id="edit-icon" class="fas fa-pen"></i></button>
                </div>

                <div id="reader-features" class="flex overflow-x-auto gap-2 p-2 no-scrollbar items-center bg-black/20 select-none">
                    <button onclick="changeGlobalFontSize(-2)" class="px-3 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">A-</button>
                    <button onclick="changeGlobalFontSize(2)" class="px-3 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">A+</button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    
                    <button onclick="toggleFavoriteCurrent()" id="btn-favorite" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="far fa-heart text-gold-500"></i> Favorit</button>
                    <button onclick="shareCurrentDoa()" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-share-nodes text-gold-500"></i> Share</button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    
                    <button onclick="toggleWakeLock()" id="btn-wakelock" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-lightbulb text-gold-500"></i> Layar</button>
                    <button onclick="toggleAutoScroll()" id="btn-autoscroll" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-angle-double-down text-gold-500"></i> Scroll</button>
                </div>

                <div id="admin-features" class="hidden overflow-x-auto gap-1.5 p-2 no-scrollbar items-center bg-black/40 shadow-inner select-none">
                    <div class="flex items-center bg-royal-dark border border-gold-500/30 rounded flex-shrink-0">
                        <button onmousedown="event.preventDefault()" onclick="changeSelectedFontSize(-1)" class="px-2.5 py-1 text-gold-400 font-bold text-sm hover:bg-gold-500/10 active:bg-gold-500/20 transition-colors">A-</button>
                        <div class="w-px h-5 bg-gold-500/20"></div>
                        <span id="font-size-display" class="text-xs text-gold-400 w-12 text-center font-mono font-bold">22px</span>
                        <div class="w-px h-5 bg-gold-500/20"></div>
                        <button onmousedown="event.preventDefault()" onclick="changeSelectedFontSize(1)" class="px-2.5 py-1 text-gold-400 font-bold text-sm hover:bg-gold-500/10 active:bg-gold-500/20 transition-colors">A+</button>
                    </div>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('undo')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-undo text-xs"></i></button>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('redo')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-redo text-xs"></i></button>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('bold')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm hover:bg-gold-500/10 active:bg-gold-500/20">B</button>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('italic')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 italic text-sm hover:bg-gold-500/10 active:bg-gold-500/20">I</button>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('underline')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 underline text-sm hover:bg-gold-500/10 active:bg-gold-500/20">U</button>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('justifyLeft')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-align-left text-xs"></i></button>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('justifyCenter')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-align-center text-xs"></i></button>
                    <button onmousedown="event.preventDefault()" onclick="execCmd('justifyRight')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-align-right text-xs"></i></button>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <select ontouchstart="captureEditorSelection()" onmousedown="captureEditorSelection()" onchange="changeFontFamily(this.value); this.selectedIndex=0;" class="px-1 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 text-sm outline-none w-20">
                        <option value="" disabled selected>Font</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Amiri">Amiri</option>
                        <option value="Lateef">Lateef</option>
                        <option value="Playfair Display">Playfair</option>
                    </select>

                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onmousedown="event.preventDefault()" onclick="changeLineHeight()" class="px-2 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 flex items-center gap-1 text-xs hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-text-height"></i> Spasi</button>
                    
                    <input type="color" ontouchstart="captureEditorSelection()" onmousedown="captureEditorSelection()" onchange="changeColor(this.value)" class="w-8 h-8 p-0 ml-1 border-0 rounded bg-transparent cursor-pointer flex-shrink-0" title="Warna">
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    <button onmousedown="event.preventDefault()" onclick="promptDeleteCurrent()" class="w-8 h-8 bg-red-900/80 text-red-400 rounded border border-red-500/30 flex-shrink-0 hover:bg-red-500/20 active:bg-red-500/40"><i class="fas fa-trash text-xs"></i></button>
                </div>
            </div>

            <div class="content-scroll relative" id="scroll-container">
                <div id="detail-content" class="editor-box text-xl font-arabic" style="color: #facc15;" contenteditable="false" onblur="saveCurrentContent()"></div>
            </div>
            
            <button id="btn-scroll-top" onclick="scrollToTop()" class="hidden absolute bottom-8 right-6 bg-gold-500 text-royal-dark w-12 h-12 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.4)] items-center justify-center z-[100] hover:scale-105 transition-transform"><i class="fas fa-arrow-up text-xl"></i></button>
        </div>

        <!-- HALAMAN 4: RUANG CHAT -->
        <div id="page-chat" class="page">
            <div class="header-fixed p-4 flex justify-between items-center">
                <button onclick="window.history.back()" class="text-gold-500 text-xl"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-serif font-bold text-gold-400 tracking-widest">OBROLAN</h1>
                
                <div class="flex items-center gap-4">
                    <button onclick="promptChatName()" class="text-gold-500 text-sm hover:text-gold-400 transition-colors" title="Ubah Nama"><i class="fas fa-user-edit"></i></button>
                    <button onclick="promptSoundSelect()" class="text-gold-500 text-sm hover:text-gold-400 transition-colors" title="Pengaturan Suara"><i class="fas fa-volume-up"></i></button>
                    <button id="btn-clear-chat" onclick="promptClearChat()" class="hidden text-red-500/80 hover:text-red-400 text-sm transition-colors" title="Hapus Semua Chat"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
            
            <div class="content-scroll p-4 pb-24" id="chat-scroll-container">

            <div class="flex-none bg-royal-dark border-t border-gold-500/30 px-2 py-3 flex gap-2 items-center z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.5)]">
                <input type="file" id="chat-image-input" accept="image/*" capture="environment" class="hidden" onchange="handleChatImageUpload(event)">
                <button onclick="document.getElementById('chat-image-input').click()" class="text-gold-500 hover:text-gold-400 p-2 transition-colors flex-shrink-0" title="Kirim Foto">
                    <i class="fas fa-camera text-lg"></i>
                </button>

                <input type="text" id="chat-input" placeholder="Ketik pesan..." class="flex-grow bg-black/50 border border-gold-500/50 rounded-full px-3 py-2.5 text-white text-sm outline-none focus:border-gold-400 min-w-0" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                
                <button onclick="sendChatMessage()" class="bg-gold-500 text-black w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 shadow-md active:scale-95 transition-transform">

        <!-- HALAMAN 5: JADWAL PENGAJIAN -->
        <div id="page-schedule" class="page">
            <div class="header-fixed p-4 flex justify-between items-center">
                <button onclick="window.history.back()" class="text-gold-500 text-xl px-1"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-serif font-bold text-gold-400 tracking-widest text-sm">JADWAL PENGAJIAN</h1>
                <div class="w-16 flex justify-end">
                    <button id="btn-add-schedule" onclick="openScheduleModal()" style="display:none;" class="bg-gold-500 text-black font-bold rounded-full px-3 py-1 shadow-md text-xs whitespace-nowrap"><i class="fas fa-plus mr-1"></i>Tambah</button>
                </div>
            </div>
            
            <div class="content-scroll p-6 pb-20">
                <div id="schedule-container" class="space-y-4">
                    <div class="text-center text-slate-400 py-10 font-serif italic">Memuat jadwal...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- SKRIP UTAMA (TIDAK DIUBAH DARI VERSI STABIL) -->
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA40Q6eOPK5vKAq-q9w6OhoCTtanb6GlHI", authDomain: "buku-digital-ngopsin.firebaseapp.com", databaseURL: "https://buku-digital-ngopsin-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "buku-digital-ngopsin", storageBucket: "buku-digital-ngopsin.firebasestorage.app", messagingSenderId: "80687588401", appId: "1:80687588401:web:5bcfcbb2a3398556b16110" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('bukuSakuData');
        const dbCoverRef = database.ref('bukuSakuCover'); 
        const dbChatRef = database.ref('bukuSakuChat'); 

        let appData = [], isAdmin = false, currentActiveId = null, isEditorActive = false, baseFontSize = 22;
        let savedRange = null;
        let lastCursorRange = null;
        let editHistory = [];
        let editHistoryIndex = -1;
        let historyTimer = null;

        let userFavorites = JSON.parse(localStorage.getItem('ngopsinFavorites')) || [];
        let userCustomOrder = JSON.parse(localStorage.getItem('ngopsinOrder')) || [];
        let chatName = localStorage.getItem('ngopsinChatName') || ''; 
        let deviceId = localStorage.getItem('ngopsinDeviceId');
        if (!deviceId) {
            deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('ngopsinDeviceId', deviceId);
        }
        let lastReadChatTime = parseInt(localStorage.getItem('ngopsinLastReadChat')) || 0;
        let latestChatTimestamp = 0;

        let isReorderMode = false;
        let initialChatLoaded = false;
        let unreadChatCount = 0;
        let renderedMsgKeys = new Set();

        window.chatAudioCtx = null;

        function unlockAudioContext() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!window.chatAudioCtx) window.chatAudioCtx = new AudioContext();
                if (window.chatAudioCtx.state === 'suspended') {
                    window.chatAudioCtx.resume();
                }
            } catch (e) {}
        }
        document.addEventListener('touchstart', unlockAudioContext, { passive: true });
        document.addEventListener('click', unlockAudioContext, { passive: true });

        function saveFavorites() { localStorage.setItem('ngopsinFavorites', JSON.stringify(userFavorites)); }
        function saveCustomOrder() { localStorage.setItem('ngopsinOrder', JSON.stringify(userCustomOrder)); }

        if ('Notification' in window && Notification.permission === 'default') {
            setTimeout(() => Notification.requestPermission(), 3000);
        }

        // PWA Install & Service Worker
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBanner = document.getElementById('install-banner');
            if (installBanner) {
                installBanner.classList.remove('hidden');
                installBanner.classList.add('flex');
            }
        });

        const btnInstallEl = document.getElementById('btn-install');
        if (btnInstallEl) {
            btnInstallEl.addEventListener('click', async () => {
                const installBanner = document.getElementById('install-banner');
                if (installBanner) installBanner.classList.replace('flex', 'hidden');
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((registration) => {
                    registration.update();
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showToast("Pembaruan Tersedia! Memuat ulang...");
                                setTimeout(() => window.location.reload(), 2000);
                            }
                        });
                    });
                }).catch(()=>{});
            });
            let refreshing;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            appData = data ? (Array.isArray(data) ? data.filter(i=>i) : Object.values(data).filter(i=>i)) : [];
            if (appData.length === 0) {
                appData = [{ id: 1, title: 'Mukadimah', content: '<div style="text-align: center;"><b style="font-family: \'Playfair Display\'; color: #facc15;">Bismillahirrohmanirrohim</b><br><br>Selamat datang di Buku Saku Digital.</div>' }];
                saveData(); 
            }
            if (document.getElementById('page-toc').classList.contains('active')) renderToc(document.getElementById('search-input').value);
            if (document.getElementById('page-detail').classList.contains('active') && !isEditorActive && currentActiveId) openDetail(currentActiveId);
        });

        let coverData = { title: "Buku Saku", subtitle: "Ngopsin Mabu Park", btnText: "Buka Kitab" };
        dbCoverRef.on('value', (snapshot) => {
            if(snapshot.exists()) {
                coverData = snapshot.val();
                document.getElementById('cover-title').innerText = coverData.title;
                document.getElementById('cover-subtitle').innerText = coverData.subtitle;
                document.getElementById('cover-btnText').innerText = coverData.btnText;
            } else {
                dbCoverRef.set(coverData);
            }
        });

        window.history.replaceState({ page: 'page-cover' }, "", "");
        let lastBackPressTime = 0;

        window.addEventListener('popstate', (e) => {
            closeImageModal(); 
            closeModal();
            if (typeof closeScheduleModal === 'function') closeScheduleModal();
            if (e.state && e.state.page) {
                navigateTo(e.state.page, true);
            } else {
                const currentTime = new Date().getTime();
                if (currentTime - lastBackPressTime < 2000) {
                    // Keluar otomatis
                } else {
                    showToast("Tekan sekali lagi untuk keluar");
                    lastBackPressTime = currentTime;
                    window.history.pushState({ page: 'page-cover' }, "", "");
                }
            }
        });

        function saveData() { dbRef.set(appData).catch(() => showToast("Gagal menyimpan.")); }
        
        function showToast(msg) {
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        let modalCallback = null;
        function openModal({ title, isInput, isPassword, isSelect, confirmText, onConfirm }) {
            document.getElementById('modal-title').innerText = title;
            const inputEl = document.getElementById('modal-input');
            inputEl.value = ''; inputEl.type = isPassword ? 'password' : 'text';
            
            document.getElementById('modal-input-container').style.display = isInput ? 'block' : 'none';
            document.getElementById('modal-eye-btn').style.display = isPassword ? 'block' : 'none';
            document.getElementById('modal-select-container').style.display = isSelect ? 'block' : 'none';
            document.getElementById('btn-modal-confirm').innerText = confirmText || 'Simpan';
            
            modalCallback = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden'); document.getElementById('custom-modal').classList.add('flex');
            if(isInput) setTimeout(() => inputEl.focus(), 100);
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); document.getElementById('custom-modal').classList.remove('flex'); }
        function toggleModalPassword() {
            const inp = document.getElementById('modal-input'), icn = document.getElementById('modal-eye-icon');
            if(inp.type === 'password') { inp.type = 'text'; icn.className = 'fas fa-eye'; } 
            else { inp.type = 'password'; icn.className = 'fas fa-eye-slash'; }
        }

        document.getElementById('btn-modal-confirm').addEventListener('click', () => { 
            if(modalCallback) {
                let val = null;
                if (document.getElementById('modal-input-container').style.display !== 'none') {
                    val = document.getElementById('modal-input').value;
                } else if (document.getElementById('modal-select-container').style.display !== 'none') {
                    val = document.getElementById('modal-select').value;
                }
                modalCallback(val); 
            }
            closeModal(); 
        });

        function openImageModal(src) {
            document.getElementById('image-modal-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
            document.getElementById('image-modal').classList.add('flex');
        }
        function closeImageModal() {
            document.getElementById('image-modal').classList.remove('flex');
            document.getElementById('image-modal').classList.add('hidden');
        }

        function updateAdminUI() {
            document.querySelectorAll('.cover-edit-icon').forEach(el => {
                if (isAdmin) { el.classList.remove('hidden'); el.classList.add('flex'); } 
                else { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            document.getElementById('btn-add-toc').style.display = isAdmin ? 'block' : 'none';
            const btnClearChat = document.getElementById('btn-clear-chat');
            if (btnClearChat) {
                if (isAdmin) btnClearChat.classList.remove('hidden');
                else btnClearChat.classList.add('hidden');
            }
            if (typeof syncScheduleAdminUI === 'function') syncScheduleAdminUI();
            if(document.getElementById('page-toc').classList.contains('active')) renderToc(document.getElementById('search-input').value);
        }

        function promptAdminLogin() {
            if(isAdmin) {
                isAdmin = false; showToast("Admin Logout.");
                document.getElementById('admin-icon').className = 'fas fa-lock text-sm'; document.getElementById('admin-icon').parentElement.classList.replace('text-gold-500', 'text-slate-600'); 
                updateAdminUI(); return;
            }
            openModal({ title: 'Sandi Admin', isInput: true, isPassword: true, onConfirm: (val) => {
                if(val === 'ngopsinoznet') {
                    isAdmin = true; showToast("Akses Terbuka!");
                    document.getElementById('admin-icon').className = 'fas fa-unlock text-sm'; document.getElementById('admin-icon').parentElement.classList.replace('text-slate-600', 'text-gold-500');
                    updateAdminUI();
                } else showToast("Sandi Salah!");
            }});
        }

        function editCoverData(field) {
            let fieldName = field === 'title' ? 'Judul Utama' : field === 'subtitle' ? 'Subjudul' : 'Teks Tombol';
            openModal({ title: `Ubah ${fieldName}`, isInput: true, onConfirm: (val) => {
                if(val) {
                    coverData[field] = val;
                    dbCoverRef.set(coverData).then(() => showToast('Berhasil disimpan!'));
                }
            }});
            setTimeout(() => document.getElementById('modal-input').value = coverData[field], 50);
        }

        function navigateTo(pageId, isPopState = false) {
            ['page-cover', 'page-toc', 'page-detail', 'page-chat', 'page-schedule'].forEach(id => { 
                const el = document.getElementById(id);
                if (el) el.classList.remove('active'); 
            });
            const target = document.getElementById(pageId);
            if (target) target.classList.add('active');
            
            if(pageId === 'page-toc') {
                document.getElementById('search-input').value = ''; 
                isReorderMode = false;
                document.getElementById('btn-reorder-mode').classList.replace('bg-gold-500', 'bg-royal-dark');
                document.getElementById('btn-reorder-mode').classList.replace('text-black', 'text-gold-500');
                renderToc();
            }

            if(pageId === 'page-schedule' && typeof renderSchedules === 'function') {
                if (typeof syncScheduleAdminUI === 'function') syncScheduleAdminUI();
                renderSchedules();
            }

            if (!isPopState) {
                window.history.pushState({ page: pageId }, "", "");
            }
        }

        function handleSearch(e) { renderToc(e.target.value); }

        function toggleReorderMode() {
            isReorderMode = !isReorderMode;
            const btn = document.getElementById('btn-reorder-mode');
            if(isReorderMode) {
                btn.classList.replace('bg-royal-dark', 'bg-gold-500');
                btn.classList.replace('text-gold-500', 'text-black');
                showToast("Mode Susun Aktif");
            } else {
                btn.classList.replace('bg-gold-500', 'bg-royal-dark');
                btn.classList.replace('text-black', 'text-gold-500');
            }
            renderToc(document.getElementById('search-input').value);
        }

        function moveItem(id, direction, e) {
            e.stopPropagation();
            appData.forEach(item => { if(!userCustomOrder.includes(item.id)) userCustomOrder.push(item.id); });

            const index = userCustomOrder.indexOf(id);
            if (index < 0) return;

            if (direction === 'up' && index > 0) {
                [userCustomOrder[index - 1], userCustomOrder[index]] = [userCustomOrder[index], userCustomOrder[index - 1]];
            } else if (direction === 'down' && index < userCustomOrder.length - 1) {
                [userCustomOrder[index + 1], userCustomOrder[index]] = [userCustomOrder[index], userCustomOrder[index + 1]];
            }
            
            saveCustomOrder();
            renderToc(document.getElementById('search-input').value);
        }

        function renderToc(searchQuery = '') {
            const container = document.getElementById('toc-container'); container.innerHTML = '';
            
            let sortedData = [...appData];
            if(userCustomOrder.length > 0) {
                sortedData.sort((a, b) => {
                    let indexA = userCustomOrder.indexOf(a.id);
                    let indexB = userCustomOrder.indexOf(b.id);
                    if (indexA === -1) indexA = 999999;
                    if (indexB === -1) indexB = 999999;
                    return indexA - indexB;
                });
            }

            const filteredData = sortedData.filter(item => {
                if(!item) return false;
                if(!isAdmin && item.hidden) return false; 
                const title = (item.title || '').toLowerCase();
                return title.includes(searchQuery.toLowerCase());
            });

            if(filteredData.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-10 font-serif italic">Data tidak ditemukan...</div>`;
                return;
            }

            let validCounter = 1; 

            filteredData.forEach((item) => {
                let displayNum = (isAdmin && item.hidden) ? '-' : validCounter++;
                
                const btn = document.createElement('div');
                btn.className = 'bg-royal-dark/60 border border-gold-500/20 p-4 rounded-xl shadow-md flex items-center justify-between hover:bg-royal-base transition-colors';
                
                let titleClass = item.hidden ? 'text-slate-500 italic line-through' : 'text-slate-100';
                let favIndicator = userFavorites.includes(item.id) ? `<i class="fas fa-heart text-red-500 ml-2 text-[10px] transform -translate-y-1"></i>` : '';

                let titleHTML = `
                    <div class="flex items-center flex-grow cursor-pointer" onclick="openDetail(${item.id})">
                        <div class="w-8 h-8 rounded-full bg-gold-500/10 text-gold-400 flex items-center justify-center font-bold text-sm mr-3 border border-gold-500/30 flex-shrink-0">${displayNum}</div>
                        <span class="font-serif ${titleClass}">${(item.title||'').replace(/^\d+[\.\-]?\s*/, '')}</span> ${favIndicator}
                    </div>
                `;

                let actionHTML = '';
                
                if (isReorderMode) {
                    actionHTML = `
                        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
                            <button onclick="moveItem(${item.id}, 'up', event)" class="w-8 h-8 rounded-full bg-royal-dark text-gold-400 flex items-center justify-center border border-gold-500/30 hover:bg-gold-500 hover:text-black transition-colors"><i class="fas fa-arrow-up"></i></button>
                            <button onclick="moveItem(${item.id}, 'down', event)" class="w-8 h-8 rounded-full bg-royal-dark text-gold-400 flex items-center justify-center border border-gold-500/30 hover:bg-gold-500 hover:text-black transition-colors"><i class="fas fa-arrow-down"></i></button>
                        </div>
                    `;
                } else if (isAdmin) {
                    let eyeIcon = item.hidden ? 'fa-eye-slash text-slate-500' : 'fa-eye text-gold-500/80 hover:text-gold-400';
                    actionHTML = `
                        <div class="flex items-center gap-4 flex-shrink-0 ml-3">
                            <button onclick="toggleVisibility(${item.id}, event)" class="p-1 transition-colors" title="Sembunyikan/Tampilkan">
                                <i class="fas ${eyeIcon}"></i>
                            </button>
                            <button onclick="promptDeleteToc(${item.id}, event)" class="p-1 text-red-500/80 hover:text-red-400 transition-colors" title="Hapus Doa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                } else {
                    actionHTML = `<i class="fas fa-chevron-right text-gold-500/50 text-xs ml-3"></i>`;
                }

                btn.innerHTML = titleHTML + actionHTML;
                container.appendChild(btn);
            });
        }

        function toggleVisibility(id, e) {
            e.stopPropagation();
            const item = appData.find(x => x.id === id);
            if(item) {
                item.hidden = !item.hidden;
                saveData();
                showToast(item.hidden ? 'Doa disembunyikan' : 'Doa ditampilkan');
                renderToc(document.getElementById('search-input').value);
            }
        }

        function promptDeleteToc(id, e) {
            e.stopPropagation();
            openModal({ title: 'Hapus Doa Ini Secara Permanen?', isInput: false, confirmText: 'Hapus', onConfirm: () => {
                appData = appData.filter(x => x.id !== id); 
                saveData(); 
                showToast('Doa Berhasil Dihapus!');
                renderToc(document.getElementById('search-input').value);
            }});
        }

        function promptNewToc() {
            openModal({ title: 'Tambah Doa', isInput: true, onConfirm: (val) => {
                if(val) { 
                    appData.push({ id: Date.now(), title: val, content: '<div style="text-align:center;">Ketik di sini...</div>', hidden: false }); 
                    saveData(); 
                    showToast('Ditambahkan!'); 
                    renderToc(document.getElementById('search-input').value);
                }
            }});
        }

        function toggleFavoriteCurrent() {
            if(!currentActiveId) return;
            const index = userFavorites.indexOf(currentActiveId);
            if(index > -1) {
                userFavorites.splice(index, 1);
                showToast("Dihapus dari Favorit");
            } else {
                userFavorites.push(currentActiveId);
                showToast("Ditambahkan ke Favorit");
            }
            saveFavorites();
            updateFavoriteBtnUI();
        }

        function updateFavoriteBtnUI() {
            const btnFav = document.getElementById('btn-favorite');
            if(userFavorites.includes(currentActiveId)) {
                btnFav.innerHTML = '<i class="fas fa-heart text-red-500"></i> <span class="text-slate-300">Favorit</span>';
                btnFav.classList.add('border-red-500/50');
            } else {
                btnFav.innerHTML = '<i class="far fa-heart text-gold-500"></i> <span class="text-slate-300">Favorit</span>';
                btnFav.classList.remove('border-red-500/50');
            }
        }

        function shareCurrentDoa() {
            const item = appData.find(x => x.id === currentActiveId);
            if(!item) return;
            let cleanTitle = (item.title||'').replace(/^\d+[\.\-]?\s*/, '');
            let shareText = `Baca ${cleanTitle} di Buku Saku Digital Ngopsin.`;
            
            if (navigator.share) {
                navigator.share({
                    title: cleanTitle,
                    text: shareText,
                    url: window.location.href
                }).catch(err => console.log('Share error:', err));
            } else {
                navigator.clipboard.writeText(shareText + " " + window.location.href);
                showToast("Teks & Link disalin!");
            }
        }

        function openDetail(id) {
            currentActiveId = id; const item = appData.find(x => x.id === id); if(!item) return;
            document.getElementById('detail-title').innerText = (item.title||'').replace(/^\d+[\.\-]?\s*/, '');
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = item.content || ""; contentEl.style.fontSize = baseFontSize + 'px';
            if(contentEl.dataset.lh) changeLineHeightGlobal(contentEl.dataset.lh);
            document.getElementById('btn-edit-mode').style.display = isAdmin ? 'block' : 'none';
            isEditorActive = false;
            savedRange = null;
            lastCursorRange = null;
            document.getElementById('reader-features').classList.replace('hidden', 'flex');
            document.getElementById('admin-features').classList.replace('flex', 'hidden');
            document.getElementById('edit-icon').className = 'fas fa-pen';
            document.getElementById('btn-edit-mode').classList.replace('text-gold-400', 'text-slate-500');
            contentEl.setAttribute('contenteditable', 'false');
            updateFavoriteBtnUI(); 
            navigateTo('page-detail');
        }

        const scrollContainer = document.getElementById('scroll-container');
        const btnScrollTop = document.getElementById('btn-scroll-top');

        scrollContainer.addEventListener('scroll', function() {
            if (this.scrollTop > (this.clientHeight * 0.8)) {
                btnScrollTop.classList.remove('hidden');
                btnScrollTop.classList.add('flex');
            } else {
                btnScrollTop.classList.remove('flex');
                btnScrollTop.classList.add('hidden');
            }
        });

        function scrollToTop() {
            scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let scrollInterval, isScrolling = false;
        function toggleAutoScroll() {
            const btn = document.getElementById('btn-autoscroll');
            if (isScrolling) { 
                clearInterval(scrollInterval); 
                isScrolling = false; 
                btn.classList.replace('text-gold-400', 'text-slate-300'); 
            } else { 
                isScrolling = true; 
                btn.classList.replace('text-slate-300', 'text-gold-400'); 
                scrollInterval = setInterval(() => { 
                    scrollContainer.scrollBy({ top: 1, left: 0, behavior: 'auto' }); 
                }, 50); 
            }
        }

        // ============ EDITOR STABIL: A-/A+, SPASI PARAGRAF, FONT, WARNA & UNDO/REDO ============
        const editorContent = document.getElementById('detail-content');

        function pushEditHistory() {
            if (!isEditorActive) return;
            const currentHTML = editorContent.innerHTML;
            if (editHistory[editHistoryIndex] === currentHTML) return;
            editHistory = editHistory.slice(0, editHistoryIndex + 1);
            editHistory.push(currentHTML);
            if (editHistory.length > 50) editHistory.shift();
            editHistoryIndex = editHistory.length - 1;
        }

        function toggleEditor() {
            isEditorActive = !isEditorActive;
            const rBar = document.getElementById('reader-features'), aBar = document.getElementById('admin-features'), btnEdit = document.getElementById('btn-edit-mode'), iconEdit = document.getElementById('edit-icon');
            if (isEditorActive) {
                rBar.classList.replace('flex', 'hidden'); aBar.classList.replace('hidden', 'flex');
                iconEdit.className = 'fas fa-save'; btnEdit.classList.replace('text-slate-500', 'text-gold-400');
                editorContent.setAttribute('contenteditable', 'true'); 
                savedRange = null;
                lastCursorRange = null;
                editHistory = [editorContent.innerHTML];
                editHistoryIndex = 0;
                document.getElementById('font-size-display').innerText = baseFontSize + 'px';
                showToast("Mode Edit Aktif.");
            } else {
                aBar.classList.replace('flex', 'hidden'); rBar.classList.replace('hidden', 'flex');
                iconEdit.className = 'fas fa-pen'; btnEdit.classList.replace('text-gold-400', 'text-slate-500');
                editorContent.setAttribute('contenteditable', 'false');
                savedRange = null;
                lastCursorRange = null;
                saveCurrentContent();
                showToast("Tersimpan.");
            }
        }

        function getSelectedTextNodes(range) {
            const textNodes = [];
            if (!range) return textNodes;
            const walker = document.createTreeWalker(
                editorContent,
                NodeFilter.SHOW_TEXT,
                null
            );
            let n;
            while ((n = walker.nextNode())) {
                const len = n.nodeValue ? n.nodeValue.length : 0;
                if (len === 0) continue;
                try {
                    if (range.comparePoint(n, len) < 0) continue;
                    if (range.comparePoint(n, 0) > 0) continue;
                } catch (e) {
                    continue;
                }
                if (n === range.startContainer && range.startOffset >= len) continue;
                if (n === range.endContainer && range.endOffset <= 0) continue;
                textNodes.push(n);
            }
            return textNodes;
        }

        function splitAndGetSelectedTextNodes(range) {
            const rawNodes = getSelectedTextNodes(range);
            if (rawNodes.length === 0) return [];

            const startContainer = range.startContainer;
            const startOffset = range.startOffset;
            const endContainer = range.endContainer;
            const endOffset = range.endOffset;

            const finalNodes = [];
            for (let i = 0; i < rawNodes.length; i++) {
                let node = rawNodes[i];
                const s = (node === startContainer) ? startOffset : 0;
                const e = (node === endContainer) ? endOffset : node.length;
                if (e <= s) continue;
                if (e < node.length) {
                    node.splitText(e);
                }
                if (s > 0) {
                    node = node.splitText(s);
                }
                finalNodes.push(node);
            }
            return finalNodes;
        }

        function hasOnlyChildNode(parent, target) {
            for (let c = parent.firstChild; c; c = c.nextSibling) {
                if (c === target) continue;
                if (c.nodeType === 3 && c.nodeValue === '') continue;
                return false;
            }
            return true;
        }

        function getReferenceElementFromRange(range) {
            if (!range) return null;
            if (!range.collapsed) {
                const nodes = getSelectedTextNodes(range);
                const meaningful = nodes.find(n => n.nodeValue.replace(/[\r\n\s]/g, '').length > 0) || nodes[0];
                if (meaningful && meaningful.parentElement) return meaningful.parentElement;
            }
            const sc = range.startContainer;
            if (sc.nodeType === 3) return sc.parentElement;
            if (sc.nodeType === 1) {
                const child = sc.childNodes[range.startOffset];
                if (child) return child.nodeType === 3 ? child.parentElement : child;
                return sc;
            }
            return editorContent;
        }

        function updateFontSizeDisplay() {
            if (!isEditorActive) return;
            const activeRange = (savedRange && !savedRange.collapsed) ? savedRange : lastCursorRange;
            const refEl = getReferenceElementFromRange(activeRange);
            if (refEl) {
                const size = Math.round(parseFloat(window.getComputedStyle(refEl).fontSize)) || baseFontSize;
                document.getElementById('font-size-display').innerText = size + 'px';
            }
        }

        function captureEditorSelection() {
            if (!isEditorActive) return;
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editorContent.contains(range.commonAncestorContainer)) {
                    lastCursorRange = range.cloneRange();
                    if (!range.collapsed) {
                        savedRange = range.cloneRange();
                    }
                    updateFontSizeDisplay();
                }
            }
        }

        document.addEventListener('selectionchange', captureEditorSelection);
        editorContent.addEventListener('touchend', () => setTimeout(captureEditorSelection, 60));
        editorContent.addEventListener('mouseup', captureEditorSelection);
        editorContent.addEventListener('keyup', captureEditorSelection);

        editorContent.addEventListener('click', () => {
            if (!isEditorActive) return;
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (range.collapsed && editorContent.contains(range.commonAncestorContainer)) {
                    savedRange = null;
                    lastCursorRange = range.cloneRange();
                    updateFontSizeDisplay();
                }
            }
        });

        function restoreSavedSelection(allowCollapsed = false) {
            const liveSel = window.getSelection();
            if (liveSel && liveSel.rangeCount > 0) {
                const liveRange = liveSel.getRangeAt(0);
                if (editorContent.contains(liveRange.commonAncestorContainer) && !liveRange.collapsed) {
                    savedRange = liveRange.cloneRange();
                    lastCursorRange = liveRange.cloneRange();
                    return true;
                }
            }

            const targetRange = (savedRange && !savedRange.collapsed)
                ? savedRange
                : (allowCollapsed ? lastCursorRange : null);

            if (!targetRange) return false;
            if (!editorContent.contains(targetRange.startContainer) || !editorContent.contains(targetRange.endContainer)) {
                return false;
            }

            editorContent.focus({ preventScroll: true });
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(targetRange);
            return true;
        }

        function refreshSavedRangeFromLive() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editorContent.contains(range.commonAncestorContainer)) {
                    lastCursorRange = range.cloneRange();
                    if (!range.collapsed) {
                        savedRange = range.cloneRange();
                    }
                    updateFontSizeDisplay();
                }
            }
        }

        function applyInlineStyleToSelection(styleProp, styleVal) {
            if (!restoreSavedSelection(false)) {
                showToast("Tandai (drag) teks dulu!");
                return false;
            }

            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) {
                showToast("Tandai (drag) teks dulu!");
                return false;
            }

            const range = sel.getRangeAt(0);
            const finalNodes = splitAndGetSelectedTextNodes(range);
            if (finalNodes.length === 0) {
                showToast("Tandai (drag) teks dulu!");
                return false;
            }

            finalNodes.forEach(node => {
                if (finalNodes.length > 1 && node.nodeValue.replace(/[\r\n]/g, '').length === 0) return;
                const parent = node.parentElement;
                if (parent && parent !== editorContent && (parent.tagName === 'SPAN' || parent.tagName === 'FONT') && hasOnlyChildNode(parent, node)) {
                    if (styleProp === 'fontSize') parent.removeAttribute('size');
                    if (styleProp === 'fontFamily') parent.removeAttribute('face');
                    if (styleProp === 'color') parent.removeAttribute('color');
                    parent.style[styleProp] = styleVal;
                } else {
                    const span = document.createElement('span');
                    span.style[styleProp] = styleVal;
                    node.parentNode.insertBefore(span, node);
                    span.appendChild(node);
                }
            });

            const newRange = document.createRange();
            newRange.setStart(finalNodes[0], 0);
            const lastNode = finalNodes[finalNodes.length - 1];
            newRange.setEnd(lastNode, lastNode.length);
            sel.removeAllRanges();
            sel.addRange(newRange);
            savedRange = newRange.cloneRange();
            lastCursorRange = newRange.cloneRange();

            pushEditHistory();
            saveCurrentContent();
            return true;
        }

        function execCmd(command, value = null) {
            if (command === 'undo') {
                if (editHistoryIndex > 0) {
                    editHistoryIndex--;
                    editorContent.innerHTML = editHistory[editHistoryIndex];
                    savedRange = null;
                    lastCursorRange = null;
                    saveCurrentContent();
                } else {
                    showToast("Tidak ada riwayat undo.");
                }
                return;
            }
            if (command === 'redo') {
                if (editHistoryIndex < editHistory.length - 1) {
                    editHistoryIndex++;
                    editorContent.innerHTML = editHistory[editHistoryIndex];
                    savedRange = null;
                    lastCursorRange = null;
                    saveCurrentContent();
                } else {
                    showToast("Tidak ada riwayat redo.");
                }
                return;
            }

            const allowNoDrag = ['justifyLeft', 'justifyCenter', 'justifyRight'].includes(command);
            if (allowNoDrag) {
                if (!restoreSavedSelection(true)) editorContent.focus({ preventScroll: true });
            } else {
                if (!restoreSavedSelection(false)) return showToast("Tandai (drag) teks dulu!");
            }
            document.execCommand('styleWithCSS', false, true);
            document.execCommand(command, false, value);
            refreshSavedRangeFromLive();
            pushEditHistory();
            saveCurrentContent();
        }

        function changeColor(color) {
            if (!color) return;
            applyInlineStyleToSelection('color', color);
        }

        function changeFontFamily(fontName) {

        function changeSelectedFontSize(step) {
            if (!restoreSavedSelection(false)) return showToast("Tandai (drag) teks dulu!");

            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return showToast("Tandai (drag) teks dulu!");

            const range = sel.getRangeAt(0);
            const refEl = getReferenceElementFromRange(range);
            let currentSize = refEl ? Math.round(parseFloat(window.getComputedStyle(refEl).fontSize)) : baseFontSize;
            if (!currentSize || isNaN(currentSize)) currentSize = 22;

            let newSize = currentSize + step;
            if (newSize < 8) newSize = 8;
            if (newSize > 40) newSize = 40;

            if (applyInlineStyleToSelection('fontSize', newSize + 'px')) {
                document.getElementById('font-size-display').innerText = newSize + 'px';
            }
        }

        function changeLineHeight() {
            const hasSelection = restoreSavedSelection(true);
            const sel = window.getSelection();
            const activeRange = (hasSelection && sel && sel.rangeCount > 0)
                ? sel.getRangeAt(0)
                : ((savedRange && !savedRange.collapsed) ? savedRange : lastCursorRange);

            const blockTags = new Set(['DIV', 'P', 'LI', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6']);
            const findNearestBlock = (startNode) => {
                let el = startNode && startNode.nodeType === 3 ? startNode.parentElement : startNode;
                while (el && el !== editorContent && !blockTags.has(el.tagName)) {
                    el = el.parentElement;
                }
                return (el && el !== editorContent && editorContent.contains(el)) ? el : null;
            };

            const targetBlocks = [];
            const addBlock = (b) => {
                if (b && !targetBlocks.includes(b)) targetBlocks.push(b);
            };

            if (activeRange) {
                if (!activeRange.collapsed) {
                    const textNodes = getSelectedTextNodes(activeRange);
                    textNodes.forEach(tn => {
                        if (tn.nodeValue.replace(/[\r\n\s]/g, '').length === 0) return;
                        addBlock(findNearestBlock(tn));
                    });
                }
                if (targetBlocks.length === 0) {
                    addBlock(findNearestBlock(activeRange.startContainer));
                }
            }

            if (targetBlocks.length === 0) {
                targetBlocks.push(editorContent);
            }

            const oldForceStyle = document.getElementById('force-line-height');
            if (oldForceStyle) oldForceStyle.remove();

            const lhSequence = [1.0, 1.5, 2.0, 2.5, 3.0];
            const firstBlock = targetBlocks[0];
            let currentVal = parseFloat(firstBlock.dataset.lh) || parseFloat(firstBlock.style.lineHeight);
            let nextIndex = 0;

            if (!isNaN(currentVal)) {
                const matchedIdx = lhSequence.findIndex(v => Math.abs(v - currentVal) < 0.05);
                if (matchedIdx !== -1) {
                    nextIndex = (matchedIdx + 1) % lhSequence.length;
                } else {
                    const higherIdx = lhSequence.findIndex(v => v > currentVal);
                    nextIndex = higherIdx !== -1 ? higherIdx : 0;
                }
            } else {
                nextIndex = 2;
            }

            const newLH = lhSequence[nextIndex];
            targetBlocks.forEach(block => {
                block.style.lineHeight = String(newLH);
                block.dataset.lh = String(newLH);
                block.querySelectorAll('span, font, b, i, u, strong, em').forEach(inlineEl => {
                    if (inlineEl.style.lineHeight) inlineEl.style.lineHeight = '';
                });
            });

            showToast(`Spasi Paragraf: ${newLH}`);
            pushEditHistory();
            saveCurrentContent();
        }

        function changeGlobalFontSize(step) {
            baseFontSize += step; 
            if(baseFontSize < 14) baseFontSize = 14; 
            if(baseFontSize > 60) baseFontSize = 60;
            
            editorContent.style.fontSize = baseFontSize + 'px';
            editorContent.querySelectorAll('*').forEach(el => {

        }

        function playCustomSound() {
            try {
                const soundType = localStorage.getItem('ngopsinChatSound') || '1';
                if(soundType === '0') return; 

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if(!AudioContext) return;
                
                if(!window.chatAudioCtx) window.chatAudioCtx = new AudioContext();
                const ctx = window.chatAudioCtx;
                if(ctx.state === 'suspended') ctx.resume();

                const gain = ctx.createGain();
                gain.connect(ctx.destination);

                if (soundType === '1') { 
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.connect(gain); osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (soundType === '2') { 
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                    osc.connect(gain); osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (soundType === '3') { 
                    const notes = [523.25, 659.25, 783.99]; 
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        const gainNode = ctx.createGain();
                        gainNode.connect(ctx.destination);
                        gainNode.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
                        gainNode.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.1 + 0.05);
                        gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.1 + 0.3);
                        osc.connect(gainNode); osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                    });
                }
            } catch(e) {}
        }

        function handleChatImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            showToast("Memproses gambar...");
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; 
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                    sendChatImage(base64Data);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function sendChatImage(base64Image) {
            if (!chatName && !isAdmin) {
                promptChatName();
                return;
            }
            
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            dbChatRef.push({
                name: chatName || (isAdmin ? 'Admin' : 'Anonim'),
                senderId: deviceId,
                text: '', 
                image: base64Image,
                time: timeString,
                isAdmin: isAdmin,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // ============ SISTEM PEMUATAN, BADGE & NOTIFIKASI CHAT REAL-TIME ============
        const chatQuery = dbChatRef.limitToLast(100);
        
        chatQuery.once('value', (snapshot) => {
            let latestUnreadMsg = null;

            snapshot.forEach(child => {
                const msg = child.val();
                if (!msg) return;
                renderedMsgKeys.add(child.key);
                renderChatMessage(msg, child.key);

                const msgTime = msg.timestamp || 0;
                if (msgTime > latestChatTimestamp) latestChatTimestamp = msgTime;

                if (!isMyMessage(msg) && msgTime > lastReadChatTime) {
                    const isChatOpen = document.getElementById('page-chat').classList.contains('active');
                    if (!isChatOpen) {
                        unreadChatCount++;
                        latestUnreadMsg = msg;
                    }
                }
            });

            if (unreadChatCount > 0) {
                updateChatBadge();
                playCustomSound();
                if (latestUnreadMsg) showSystemNotification(latestUnreadMsg);
            }

            initialChatLoaded = true;
            setTimeout(scrollToBottomChat, 100);
            
            chatQuery.on('child_added', (newSnapshot) => {
                if (renderedMsgKeys.has(newSnapshot.key)) return;
                renderedMsgKeys.add(newSnapshot.key);
                
                const msg = newSnapshot.val();
                if (!msg) return;
                renderChatMessage(msg, newSnapshot.key);

                const msgTime = msg.timestamp || Date.now();
                if (msgTime > latestChatTimestamp) latestChatTimestamp = msgTime;
                
                if (initialChatLoaded) {
                    const isChatOpen = document.getElementById('page-chat').classList.contains('active');
                    
                    if (!isMyMessage(msg)) {
                        if (!isChatOpen) {
                            unreadChatCount++;
                            updateChatBadge();
                        } else {
                            markChatAsRead();
                        }
                        
                        playCustomSound(); 
                        showSystemNotification(msg);
                    }
                }
            });
        });

            renderedMsgKeys.delete(oldSnapshot.key);
