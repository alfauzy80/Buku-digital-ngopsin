<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Saku Digital - Ngopsin Mabu Park</title>
    
    <meta name="theme-color" content="#0d9488">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lateef&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], arabic: ['Amiri', 'serif'] },
                    colors: { islamic: { light: '#e6f2f0', primary: '#0d9488', dark: '#115e59', gold: '#d97706', night: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        /* KUNCI UTAMA: Body tidak boleh scroll sama sekali */
        body { transition: background-color 0.3s, color 0.3s; margin: 0; overflow: hidden; height: 100vh; height: -webkit-fill-available; }
        
        .bg-pattern { background-color: #ffffff; background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%230d9488' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E"); }
        .dark .bg-pattern { background-color: #0f172a; background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E"); }
        
        .content-area { outline: none; min-height: 100%; }
        .content-area[contenteditable="true"]:focus { border: 1px dashed #0d9488; padding: 4px; border-radius: 4px; }
        
        /* Flexbox ajaib agar header diam dan konten yang scroll */
        .page-container { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; width: 100%; max-width: 28rem; margin: 0 auto; position: relative; }
        .header-section { flex-shrink: 0; z-index: 50; }
        .scrollable-content { flex-grow: 1; overflow-y: auto; padding: 1.5rem; padding-bottom: 5rem; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-pattern text-slate-800 dark:text-slate-200 selection:bg-islamic-primary selection:text-white">

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-islamic-dark text-white px-4 py-2 rounded-full shadow-lg z-[100] transition-opacity duration-300 opacity-0 pointer-events-none">Pesan</div>

    <!-- MODAL -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-[90] hidden items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm transform transition-all">
            <h3 id="modal-title" class="text-xl font-bold text-islamic-dark dark:text-islamic-light mb-4">Judul</h3>
            <div class="relative w-full mb-6" id="modal-input-container">
                <input type="text" id="modal-input" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg outline-none dark:bg-slate-700 dark:text-white">
                <button id="modal-eye-btn" class="absolute right-3 top-2.5 text-gray-500 hidden" onclick="toggleModalPassword()"><i class="fas fa-eye-slash" id="modal-eye-icon"></i></button>
            </div>
            <p id="modal-desc" class="hidden text-gray-600 dark:text-gray-300 mb-6">Deskripsi</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-slate-700 font-medium">Batal</button>
                <button id="btn-modal-confirm" class="px-4 py-2 rounded-lg bg-islamic-primary text-white font-medium shadow-md">Simpan</button>
            </div>
        </div>
    </div>

    <!-- HALAMAN 1: COVER -->
    <div id="page-cover" class="page-container bg-gradient-to-b from-slate-900 to-islamic-night flex flex-col items-center justify-center text-center overflow-hidden">
        <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40">
            <div class="absolute top-10 left-10 w-1 h-1 bg-white rounded-full animate-pulse"></div>
            <div class="absolute top-20 right-20 w-2 h-2 bg-white rounded-full animate-pulse"></div>
        </div>
        <div class="absolute top-0 left-6 opacity-80"><i class="fas fa-lantern text-4xl text-islamic-gold"></i></div>
        <div class="absolute top-20 w-full flex justify-center opacity-30"><i class="fas fa-moon text-9xl text-yellow-300"></i></div>
        
        <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-500 mb-2 z-10 font-arabic tracking-wide drop-shadow-md mt-10">BUKU SAKU DIGITAL</h1>
        <div class="w-24 h-1 bg-islamic-gold mx-auto mb-4 rounded z-10"></div>
        <h2 class="text-xl font-semibold text-gray-300 z-10 mb-12 tracking-wider">NGOPSIN MABU PARK</h2>
        <button onclick="navigateTo('page-toc')" class="z-10 bg-white/10 backdrop-blur-md border border-white/30 text-white font-semibold py-3 px-8 rounded-full flex items-center gap-3">
            Buka Buku <i class="fas fa-book-open"></i>
        </button>
        <button onclick="promptAdminLogin()" class="mt-8 z-10 p-2 text-white/40"><i id="admin-icon" class="fas fa-user-lock text-xl"></i></button>
    </div>

    <!-- HALAMAN 2: DAFTAR ISI -->
    <div id="page-toc" class="hidden page-container bg-white/90 dark:bg-islamic-night/95">
        <header class="header-section bg-white/95 dark:bg-slate-900/95 border-b border-gray-200 dark:border-gray-700 p-4 shadow-sm">
            <div class="flex justify-between items-center">
                <button onclick="navigateTo('page-cover')" class="text-islamic-primary dark:text-islamic-light"><i class="fas fa-home text-xl"></i></button>
                <h1 class="text-lg font-bold text-islamic-primary dark:text-islamic-light">BUKU SAKU</h1>
                <button onclick="toggleTheme()" class="text-islamic-primary dark:text-islamic-light"><i class="fas fa-adjust text-xl"></i></button>
            </div>
        </header>
        <main class="scrollable-content">
            <div class="flex items-center mb-6">
                <h2 class="text-2xl font-bold text-islamic-dark dark:text-islamic-light border-b-2 border-islamic-primary pb-1">Daftar Isi</h2>
                <button id="btn-add-toc" onclick="promptNewToc()" class="hidden ml-3 bg-islamic-gold text-white rounded-full w-7 h-7 flex items-center justify-center shadow-md"><i class="fas fa-plus"></i></button>
            </div>
            <div id="toc-container" class="space-y-3">
                <div class="text-center text-gray-500 py-4">Memuat data...</div>
            </div>
        </main>
    </div>

    <!-- HALAMAN 3: KONTEN (TERKUNCI SEMPURNA ANTI KEYBOARD) -->
    <div id="page-detail" class="hidden page-container bg-white/90 dark:bg-islamic-night/95 shadow-xl">
        
        <!-- HEADER KEBAl KEYBOARD -->
        <header class="header-section bg-white/95 dark:bg-slate-900/95 shadow-md flex flex-col">
            <!-- Navigasi Atas -->
            <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <button onclick="navigateTo('page-toc')" class="text-islamic-primary dark:text-islamic-light"><i class="fas fa-arrow-left text-xl"></i></button>
                <h1 id="detail-title" class="text-md font-bold text-islamic-dark dark:text-islamic-light truncate max-w-[200px]" ondblclick="if(isAdmin) promptEditTitle()">Judul</h1>
                <button id="btn-edit-mode" onclick="toggleEditor()" class="text-islamic-gold hidden"><i id="edit-icon" class="fas fa-edit text-xl"></i></button>
            </div>

            <!-- MENU PEMBACA (Hilang saat Edit) -->
            <div id="reader-features" class="flex overflow-x-auto gap-2 p-2 bg-gray-50 dark:bg-slate-800 text-sm no-scrollbar shrink-0">
                <button onclick="changeFontSize(-2)" class="px-3 py-1 bg-white dark:bg-slate-700 rounded shadow font-bold border border-gray-200 dark:border-gray-600 flex-shrink-0">A-</button>
                <button onclick="changeFontSize(2)" class="px-3 py-1 bg-white dark:bg-slate-700 rounded shadow font-bold border border-gray-200 dark:border-gray-600 flex-shrink-0">A+</button>
                <button onclick="toggleWakeLock()" id="btn-wakelock" class="px-3 py-1 bg-white dark:bg-slate-700 rounded shadow flex items-center gap-1 border border-gray-200 dark:border-gray-600 flex-shrink-0"><i class="fas fa-lightbulb"></i> Layar</button>
                <button onclick="toggleAutoScroll()" id="btn-autoscroll" class="px-3 py-1 bg-white dark:bg-slate-700 rounded shadow flex items-center gap-1 border border-gray-200 dark:border-gray-600 flex-shrink-0"><i class="fas fa-angle-double-down"></i> Scroll</button>
                <div class="flex items-center gap-1 px-2 py-1 bg-white dark:bg-slate-700 rounded shadow border border-gray-200 dark:border-gray-600 flex-shrink-0">
                    <i class="fas fa-music text-xs"></i>
                    <audio id="bg-audio" controls class="h-6 w-32 outline-none">
                        <source src="https://www.soundhelix.com/architectureplay/SoundHelix-Song-1.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>

            <!-- MENU ADMIN (Muncul saat Edit) -->
            <div id="admin-features" class="hidden flex-wrap gap-1 p-2 bg-islamic-light dark:bg-slate-800 text-sm border-b border-islamic-primary/20 shadow-sm shrink-0">
                <button onclick="execCmd('undo')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm"><i class="fas fa-undo"></i></button>
                <button onclick="execCmd('redo')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm"><i class="fas fa-redo"></i></button>
                <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>

                <button onclick="execCmd('bold')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm font-bold">B</button>
                <button onclick="execCmd('italic')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm italic">I</button>
                <button onclick="execCmd('underline')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm underline">U</button>
                <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
                <button onclick="execCmd('justifyLeft')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm"><i class="fas fa-align-left"></i></button>
                <button onclick="execCmd('justifyCenter')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm"><i class="fas fa-align-center"></i></button>
                <button onclick="execCmd('justifyRight')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm"><i class="fas fa-align-right"></i></button>
                <div class="w-px h-6 bg-gray-300 mx-1 self-center"></div>
                
                <select onchange="execCmd('fontName', this.value)" class="px-1 py-1 bg-white dark:bg-slate-700 rounded shadow-sm outline-none max-w-[100px]">
                    <option value="Poppins">Poppins</option>
                    <option value="Arial">Arial</option>
                    <option value="Amiri">Amiri</option>
                    <option value="Lateef">Lateef</option>
                    <option value="'Scheherazade New'">Scheherazade</option>
                </select>
                
                <input type="color" onchange="execCmd('foreColor', this.value)" class="w-7 h-7 p-0 border-0 rounded shadow-sm" title="Warna Teks">
                
                <button onclick="changeLineHeight()" class="px-2 py-1 bg-white dark:bg-slate-700 rounded shadow-sm" title="Jarak Baris"><i class="fas fa-text-height"></i></button>
                
                <div class="w-px h-6 bg-gray-300 mx-1 self-center flex-grow"></div>
                <button onclick="promptDeleteCurrent()" class="px-2 py-1 bg-red-100 text-red-600 dark:bg-red-900/40 rounded shadow-sm">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </header>

        <!-- KONTEN YANG BISA DI-SCROLL -->
        <main class="scrollable-content" id="scroll-container">
            <div id="detail-content" class="content-area text-lg leading-relaxed" contenteditable="false" onblur="saveCurrentContent()"></div>
        </main>
    </div>

    <!-- JAVASCRIPT & FIREBASE -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA40Q6eOPK5vKAq-q9w6OhoCTtanb6GlHI",
            authDomain: "buku-digital-ngopsin.firebaseapp.com",
            databaseURL: "https://buku-digital-ngopsin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "buku-digital-ngopsin",
            storageBucket: "buku-digital-ngopsin.firebasestorage.app",
            messagingSenderId: "80687588401",
            appId: "1:80687588401:web:5bcfcbb2a3398556b16110"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let appData = [];
        let isAdmin = false;
        let currentActiveId = null;
        let isEditorActive = false;
        let baseFontSize = 18;

        const dbRef = database.ref('bukuSakuData');
        
        dbRef.on('value', (snapshot) => {
            try {
                const data = snapshot.val();
                if (data && Array.isArray(data)) { appData = data.filter(item => item !== null); } 
                else if (data && typeof data === 'object') { appData = Object.values(data).filter(item => item !== null); } 
                else { appData = []; }

                if (appData.length === 0) {
                    appData = [{ id: 1, title: '1. Mukadimah', content: '<div style="text-align: center; line-height: 1.6;"><b>Bismillahirrohmanirrohim</b><br><br>Selamat datang di Buku Saku Digital.</div>' }];
                    saveData(); 
                }

                if (!document.getElementById('page-toc').classList.contains('hidden')) renderToc();
                if (!document.getElementById('page-detail').classList.contains('hidden') && !isEditorActive) {
                    if(currentActiveId) openDetail(currentActiveId);
                }
            } catch (err) {}
        });

        function saveData() { dbRef.set(appData).catch(() => showToast("Gagal menyimpan ke server.")); }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        let modalCallback = null;
        function openModal({ title, isInput, isPassword, placeholder, desc, btnText, onConfirm }) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-input-container').classList.toggle('hidden', !isInput);
            document.getElementById('modal-desc').classList.toggle('hidden', isInput);
            
            if(isInput) {
                const inputEl = document.getElementById('modal-input');
                inputEl.placeholder = placeholder || '';
                inputEl.value = '';
                inputEl.type = isPassword ? 'password' : 'text';
                document.getElementById('modal-eye-btn').classList.toggle('hidden', !isPassword);
                document.getElementById('modal-eye-icon').className = 'fas fa-eye-slash';
                setTimeout(() => inputEl.focus(), 100);
            } else { document.getElementById('modal-desc').innerText = desc || ''; }
            
            document.getElementById('btn-modal-confirm').innerText = btnText || 'Simpan';
            modalCallback = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('flex');
            modalCallback = null;
        }

        function toggleModalPassword() {
            const input = document.getElementById('modal-input');
            const icon = document.getElementById('modal-eye-icon');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye-slash'; }
        }

        document.getElementById('btn-modal-confirm').addEventListener('click', () => {
            if (modalCallback) modalCallback(document.getElementById('modal-input').value);
            closeModal();
        });

        function promptAdminLogin() {
            if(isAdmin) {
                isAdmin = false; showToast("Logout Admin Berhasil.");
                document.getElementById('admin-icon').classList.remove('text-islamic-gold');
                return;
            }
            openModal({
                title: 'Login Admin', isInput: true, isPassword: true, placeholder: 'Password...',
                onConfirm: (val) => {
                    if(val === 'ngopsinoznet') {
                        isAdmin = true; showToast("Login Admin Berhasil!");
                        document.getElementById('admin-icon').classList.add('text-islamic-gold');
                    } else showToast("Password salah!");
                }
            });
        }

        function navigateTo(pageId) {
            ['page-cover', 'page-toc', 'page-detail'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            document.getElementById(pageId).classList.remove('hidden');
            document.getElementById(pageId).classList.add('flex');
            if (pageId === 'page-toc') { renderToc(); stopAutoScroll(); }
        }

        function renderToc() {
            const container = document.getElementById('toc-container');
            container.innerHTML = '';
            document.getElementById('btn-add-toc').classList.toggle('hidden', !isAdmin);

            appData.forEach((item, index) => {
                if(!item) return;
                const btn = document.createElement('div');
                btn.className = 'flex items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-islamic-primary cursor-pointer hover:bg-gray-50';
                btn.onclick = () => openDetail(item.id);
                const titleSpan = document.createElement('span');
                titleSpan.className = 'font-semibold text-lg w-full';
                let titleText = item.title ? item.title.toString() : "Halaman Baru";
                titleSpan.innerText = `${index + 1}. ${titleText.replace(/^\d+[\.\-]?\s*/, '')}`;
                btn.appendChild(titleSpan);
                container.appendChild(btn);
            });
        }

        function promptNewToc() {
            openModal({
                title: 'Tambah Doa', isInput: true, placeholder: 'Judul Baru...',
                onConfirm: (val) => {
                    if (val && val.trim() !== "") {
                        appData.push({ id: Date.now(), title: val, content: '<div style="text-align:center; line-height: 1.6;">Ketik di sini...</div>' });
                        saveData(); showToast('Halaman ditambahkan!');
                    }
                }
            });
        }

        function openDetail(id) {
            currentActiveId = id;
            const item = appData.find(x => x.id === id);
            if (!item) return;

            document.getElementById('detail-title').innerText = (item.title||"").toString().replace(/^\d+[\.\-]?\s*/, '');
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = item.content || "";
            contentEl.style.fontSize = baseFontSize + 'px';

            document.getElementById('btn-edit-mode').classList.toggle('hidden', !isAdmin);
            
            isEditorActive = false;
            document.getElementById('reader-features').classList.remove('hidden');
            document.getElementById('reader-features').classList.add('flex');
            document.getElementById('admin-features').classList.add('hidden');
            document.getElementById('admin-features').classList.remove('flex');
            document.getElementById('edit-icon').className = 'fas fa-edit text-xl';
            document.getElementById('btn-edit-mode').classList.remove('text-green-500');
            document.getElementById('btn-edit-mode').classList.add('text-islamic-gold');
            contentEl.setAttribute('contenteditable', 'false');

            navigateTo('page-detail');
        }

        function promptEditTitle() {
            if(!isEditorActive) { showToast("Aktifkan mode edit dulu."); return; }
            const item = appData.find(x => x.id === currentActiveId);
            if(!item) return;
            openModal({
                title: 'Ubah Judul', isInput: true, placeholder: 'Ketik judul baru...',
                onConfirm: (val) => {
                    if(val) {
                        item.title = val;
                        document.getElementById('detail-title').innerText = val.replace(/^\d+[\.\-]?\s*/, '');
                        saveData(); showToast('Judul diubah!');
                    }
                }
            });
            setTimeout(() => { document.getElementById('modal-input').value = (item.title||"").toString().replace(/^\d+[\.\-]?\s*/, ''); }, 50);
        }

        function promptDeleteCurrent() {
            openModal({
                title: 'Konfirmasi Hapus', isInput: false, desc: 'Hapus permanen dari server?', btnText: 'Ya, Hapus',
                onConfirm: () => {
                    appData = appData.filter(x => x.id !== currentActiveId);
                    saveData(); navigateTo('page-toc'); showToast('Hapus berhasil!');
                }
            });
        }

        function toggleEditor() {
            isEditorActive = !isEditorActive;
            const readerBar = document.getElementById('reader-features');
            const adminBar = document.getElementById('admin-features');
            const contentEl = document.getElementById('detail-content');
            const btnEdit = document.getElementById('btn-edit-mode');
            const iconEdit = document.getElementById('edit-icon');
            
            if (isEditorActive) {
                readerBar.classList.remove('flex'); readerBar.classList.add('hidden');
                adminBar.classList.remove('hidden'); adminBar.classList.add('flex');
                
                iconEdit.className = 'fas fa-check text-xl';
                btnEdit.classList.remove('text-islamic-gold'); btnEdit.classList.add('text-green-500');
                
                contentEl.setAttribute('contenteditable', 'true');
                contentEl.focus(); showToast("Mode Edit: ON");
            } else {
                adminBar.classList.remove('flex'); adminBar.classList.add('hidden');
                readerBar.classList.remove('hidden'); readerBar.classList.add('flex');
                
                iconEdit.className = 'fas fa-edit text-xl';
                btnEdit.classList.remove('text-green-500'); btnEdit.classList.add('text-islamic-gold');
                
                contentEl.setAttribute('contenteditable', 'false');
                saveCurrentContent(); showToast("Perubahan Tersimpan.");
            }
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('detail-content').focus();
            saveCurrentContent();
        }

        function changeLineHeight() {
            const contentEl = document.getElementById('detail-content');
            let currentLH = parseFloat(contentEl.style.lineHeight) || 1.6;
            let nextLH = currentLH === 1.6 ? 2.0 : (currentLH === 2.0 ? 2.5 : 1.6);
            contentEl.style.lineHeight = nextLH;
            saveCurrentContent(); showToast(`Jarak baris disesuaikan.`);
        }

        function saveCurrentContent() {
            if (!currentActiveId || !isAdmin) return;
            const itemIndex = appData.findIndex(x => x.id === currentActiveId);
            if (itemIndex > -1) {
                appData[itemIndex].content = document.getElementById('detail-content').innerHTML;
                saveData(); 
            }
        }

        document.getElementById('detail-content').addEventListener('input', () => { if(isEditorActive) saveCurrentContent(); });

        function changeFontSize(step) {
            baseFontSize += step;
            if(baseFontSize < 12) baseFontSize = 12;
            if(baseFontSize > 50) baseFontSize = 50;
            document.getElementById('detail-content').style.fontSize = baseFontSize + 'px';
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('temaMalam', document.documentElement.classList.contains('dark'));
        }
        if(localStorage.getItem('temaMalam') === 'true') document.documentElement.classList.add('dark');

        let scrollInterval, isScrolling = false;
        function toggleAutoScroll() {
            const btn = document.getElementById('btn-autoscroll');
            const container = document.getElementById('scroll-container');
            if (isScrolling) {
                clearInterval(scrollInterval); isScrolling = false;
                btn.classList.remove('bg-islamic-primary', 'text-white');
            } else {
                isScrolling = true; btn.classList.add('bg-islamic-primary', 'text-white');
                scrollInterval = setInterval(() => { container.scrollBy({ top: 1, left: 0, behavior: 'auto' }); }, 50);
            }
        }
        function stopAutoScroll() { if (isScrolling) toggleAutoScroll(); }

        let wakeLock = null;
        async function toggleWakeLock() {
            const btn = document.getElementById('btn-wakelock');
            if ('wakeLock' in navigator) {
                try {
                    if (wakeLock !== null) {
                        await wakeLock.release(); wakeLock = null;
                        btn.classList.remove('bg-yellow-500', 'text-white');
                    } else {
                        wakeLock = await navigator.wakeLock.request('screen');
                        btn.classList.add('bg-yellow-500', 'text-white');
                        wakeLock.addEventListener('release', () => { wakeLock = null; btn.classList.remove('bg-yellow-500', 'text-white'); });
                    }
                } catch (err) { showToast('Gagal mengaktifkan kunci layar.'); }
            } else { alert('Maaf, browser HP Anda tidak mendukung fitur ini.'); }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => { console.log('SW Registered'); });
            });
        }
    </script>
</body>
</html>
