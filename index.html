<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Buku Saku Digital - Premium Edition</title>
    
    <meta name="theme-color" content="#022c22">
    <link rel="apple-touch-icon" href="./icon-512.png">
    
    <link rel="preload" href="./logo.png" as="image">
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Amiri:wght@400;700&family=Lateef:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], serif: ['Playfair Display', 'serif'], arabic: ['Amiri', 'serif'] },
                    colors: { royal: { dark: '#022c22', base: '#064e3b' }, gold: { 400: '#facc15', 500: '#eab308' } }
                }
            }
        }
    </script>
    <style>
        html, body {
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            position: fixed; 
            top: 0; left: 0;
            overflow: hidden; 
            background: radial-gradient(ellipse at top, #064e3b, #022c22, #000000); 
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent; 
        }

        .app-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            max-width: 28rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none; 
            flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
        }
        .page.active { display: flex; }

        .header-fixed {
            flex: 0 0 auto; 
            width: 100%;
            background: rgba(2, 44, 34, 0.95);
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        .content-scroll {
            flex: 1 1 auto; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding: 1.5rem; 
            padding-bottom: 20vh; 
            scroll-behavior: smooth;
        }

        .editor-box { outline: none; min-height: 100%; }
        .editor-box[contenteditable="true"]:focus { 
            border: 1px dashed rgba(234, 179, 8, 0.5); 
            border-radius: 8px; padding: 8px; background: rgba(255,255,255,0.02); 
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }
    </style>
</head>
<body class="selection:bg-gold-500 selection:text-royal-dark font-sans relative">

    <div class="app-wrapper">
        <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-royal-dark border border-gold-500 text-gold-400 px-6 py-2 rounded-full shadow-lg z-[1000] opacity-0 pointer-events-none transition-opacity duration-300 font-semibold text-sm">Pesan</div>

        <div id="install-banner" class="fixed bottom-0 left-0 w-full bg-royal-dark/95 backdrop-blur border-t border-gold-500/50 p-4 hidden flex-row justify-between items-center z-[2000] shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
            <div class="flex items-center gap-3">
                <img src="./icon-192.png" onerror="this.src='./logo.png'" alt="Icon" class="w-12 h-12 rounded-xl shadow-md border border-gold-500/30">
                <div>
                    <p class="text-gold-400 font-bold text-[15px] leading-tight">Buku Saku Digital</p>
                    <p class="text-xs text-slate-300 mt-0.5">Install aplikasi ke perangkat Anda</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-install" class="bg-gradient-to-r from-gold-500 to-gold-400 text-black px-4 py-2 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform">Install</button>
                <button onclick="document.getElementById('install-banner').classList.replace('flex','hidden')" class="text-slate-400 p-2 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div id="custom-modal" class="fixed inset-0 bg-black/80 z-[1000] hidden items-center justify-center px-4 backdrop-blur-sm">
            <div class="bg-royal-dark border border-gold-500/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <h3 id="modal-title" class="text-xl font-serif text-gold-400 mb-4">Judul</h3>
                <div class="relative w-full mb-6" id="modal-input-container">
                    <input type="text" id="modal-input" class="w-full px-4 py-3 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white focus:border-gold-400">
                    <button id="modal-eye-btn" class="absolute right-4 top-3.5 text-slate-400 hidden" onclick="toggleModalPassword()"><i class="fas fa-eye-slash" id="modal-eye-icon"></i></button>
                </div>
                <div class="flex justify-end gap-3">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:text-white">Batal</button>
                    <button id="btn-modal-confirm" class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-400 text-black font-bold rounded-lg shadow-md">Simpan</button>
                </div>
            </div>
        </div>

        <!-- HALAMAN 1: COVER -->
        <div id="page-cover" class="page active relative px-6">
            <div class="flex-grow w-full flex items-center justify-center pt-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-gold-500 blur-[40px] opacity-25 rounded-full scale-110"></div>
                    <img src="./logo.png" alt="Logo" class="w-44 h-44 object-cover relative z-10 rounded-full border-2 border-gold-500/50 shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                </div>
            </div>
            
            <div class="flex-none flex flex-col items-center justify-center pb-24 w-full relative z-20 text-center">
                <div class="relative flex items-center justify-center mb-4">
                    <h1 id="cover-title" class="text-5xl font-serif font-bold text-gold-400 tracking-wide drop-shadow-md">Buku Saku</h1>
                    <button onclick="editCoverData('title')" class="cover-edit-icon hidden absolute -right-8 top-1 bg-royal-dark border border-gold-500/50 w-7 h-7 rounded-full shadow-md items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-black">
                        <i class="fas fa-pen text-[10px]"></i>
                    </button>
                </div>

                <div class="flex items-center gap-3 mb-4">
                    <div class="h-px w-12 bg-gradient-to-r from-transparent to-gold-500"></div>
                    <i class="fas fa-gem text-gold-500 text-[10px]"></i>
                    <div class="h-px w-12 bg-gradient-to-l from-transparent to-gold-500"></div>
                </div>
                
                <div class="relative flex items-center justify-center mb-12">
                    <h2 id="cover-subtitle" class="text-xs text-slate-300 tracking-[0.2em] uppercase">Ngopsin Mabu Park</h2>
                    <button onclick="editCoverData('subtitle')" class="cover-edit-icon hidden absolute -right-8 -top-1.5 bg-royal-dark border border-gold-500/50 w-6 h-6 rounded-full shadow-md items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-black">
                        <i class="fas fa-pen text-[10px]"></i>
                    </button>
                </div>
                
                <div class="relative">
                    <button onclick="navigateTo('page-toc')" class="border border-gold-500 text-gold-400 font-serif italic py-3 px-10 rounded-full hover:bg-gold-500 hover:text-black transition-colors flex items-center gap-3 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                        <span id="cover-btnText">Buka Kitab</span> <i class="fas fa-book-open text-sm"></i>
                    </button>
                    <button onclick="editCoverData('btnText')" class="cover-edit-icon hidden absolute -top-3 -right-3 bg-royal-dark border border-gold-500 w-8 h-8 rounded-full shadow-md items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-black">
                        <i class="fas fa-pen text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="absolute bottom-8 w-full text-center z-20 left-0">
                <button onclick="promptAdminLogin()" class="p-3 text-slate-600 hover:text-gold-500 transition-colors">
                    <i id="admin-icon" class="fas fa-lock text-sm"></i>
                </button>
            </div>
        </div>

        <!-- HALAMAN 2: DAFTAR ISI -->
        <div id="page-toc" class="page">
            <div class="header-fixed p-4 flex justify-between items-center">
                <button onclick="window.history.back()" class="text-gold-500 text-xl"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-serif font-bold text-gold-400 tracking-widest">DAFTAR ISI</h1>
                <div class="w-6"></div>
            </div>
            <div class="content-scroll p-6 pb-20">
                
                <div class="flex gap-3 mb-6 items-center w-full">
                    <div class="relative flex-grow">
                        <input type="text" id="search-input" oninput="handleSearch(event)" placeholder="Cari judul..." class="w-full bg-black/40 border border-gold-500/30 text-gold-400 text-sm rounded-full px-4 py-2.5 outline-none focus:border-gold-500 transition-colors">
                        <i class="fas fa-search absolute right-4 top-3 text-gold-500/50 text-sm"></i>
                    </div>
                    <button id="btn-reorder-mode" onclick="toggleReorderMode()" class="bg-royal-dark text-gold-500 border border-gold-500/50 rounded-full px-4 py-2.5 shadow-md text-sm whitespace-nowrap transition-colors"><i class="fas fa-sort mr-1"></i>Susun</button>
                    <button id="btn-add-toc" onclick="promptNewToc()" class="hidden bg-gold-500 text-black font-bold rounded-full px-4 py-2.5 shadow-md text-sm whitespace-nowrap"><i class="fas fa-plus mr-1"></i>Tambah</button>
                </div>

                <div id="toc-container" class="space-y-3">
                    <div class="text-center text-gold-500 py-10 font-serif animate-pulse">Memuat...</div>
                </div>
            </div>
        </div>

        <!-- HALAMAN 3: KONTEN (BACA & EDIT) -->
        <div id="page-detail" class="page">
            
            <div class="header-fixed">
                <div class="flex justify-between items-center p-3 border-b border-gold-500/20">
                    <button onclick="window.history.back()" class="text-gold-400 text-xl px-2"><i class="fas fa-arrow-left"></i></button>
                    <h1 id="detail-title" class="font-serif font-bold text-gold-400 truncate max-w-[200px]" ondblclick="if(isAdmin) promptEditTitle()">Judul</h1>
                    <button id="btn-edit-mode" onclick="toggleEditor()" class="text-slate-500 hidden px-2"><i id="edit-icon" class="fas fa-pen"></i></button>
                </div>

                <div id="reader-features" class="flex overflow-x-auto gap-2 p-2 no-scrollbar items-center bg-black/20">
                    <button onclick="changeGlobalFontSize(-2)" class="px-3 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">A-</button>
                    <button onclick="changeGlobalFontSize(2)" class="px-3 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">A+</button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    
                    <button onclick="toggleFavoriteCurrent()" id="btn-favorite" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="far fa-heart text-gold-500"></i> Favorit</button>
                    <button onclick="shareCurrentDoa()" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-share-nodes text-gold-500"></i> Share</button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    
                    <button onclick="toggleWakeLock()" id="btn-wakelock" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-lightbulb text-gold-500"></i> Layar</button>
                    <button onclick="toggleAutoScroll()" id="btn-autoscroll" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-angle-double-down text-gold-500"></i> Scroll</button>
                </div>

                <div id="admin-features" class="hidden overflow-x-auto gap-1.5 p-2 no-scrollbar items-center bg-black/40 shadow-inner">
                    <div class="flex items-center bg-royal-dark border border-gold-500/30 rounded flex-shrink-0">
                        <button onclick="changeSelectedFontSize(-1)" class="px-2.5 py-1 text-gold-400 font-bold text-sm hover:bg-gold-500/10 active:bg-gold-500/20 transition-colors">A-</button>
                        <div class="w-px h-5 bg-gold-500/20"></div>
                        <span id="font-size-display" class="text-xs text-gold-400 w-12 text-center font-mono font-bold">22px</span>
                        <div class="w-px h-5 bg-gold-500/20"></div>
                        <button onclick="changeSelectedFontSize(1)" class="px-2.5 py-1 text-gold-400 font-bold text-sm hover:bg-gold-500/10 active:bg-gold-500/20 transition-colors">A+</button>
                    </div>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onclick="execCmd('undo')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-undo text-xs"></i></button>
                    <button onclick="execCmd('redo')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-redo text-xs"></i></button>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onclick="execCmd('bold')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm hover:bg-gold-500/10 active:bg-gold-500/20">B</button>
                    <button onclick="execCmd('italic')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 italic text-sm hover:bg-gold-500/10 active:bg-gold-500/20">I</button>
                    <button onclick="execCmd('underline')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 underline text-sm hover:bg-gold-500/10 active:bg-gold-500/20">U</button>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onclick="execCmd('justifyLeft')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-align-left text-xs"></i></button>
                    <button onclick="execCmd('justifyCenter')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-align-center text-xs"></i></button>
                    <button onclick="execCmd('justifyRight')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-align-right text-xs"></i></button>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <select onchange="changeFontFamily(this.value); this.selectedIndex=0;" class="px-1 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 text-sm outline-none w-20">
                        <option value="" disabled selected>Font</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Amiri">Amiri</option>
                        <option value="Lateef">Lateef</option>
                        <option value="Playfair Display">Playfair</option>
                    </select>

                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onclick="changeLineHeight()" class="px-2 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 flex items-center gap-1 text-xs hover:bg-gold-500/10 active:bg-gold-500/20"><i class="fas fa-text-height"></i> Spasi</button>
                    
                    <input type="color" oninput="changeColor(this.value)" onchange="changeColor(this.value)" class="w-8 h-8 p-0 ml-1 border-0 rounded bg-transparent cursor-pointer flex-shrink-0" title="Warna">
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    <button onclick="promptDeleteCurrent()" class="w-8 h-8 bg-red-900/80 text-red-400 rounded border border-red-500/30 flex-shrink-0 hover:bg-red-500/20 active:bg-red-500/40"><i class="fas fa-trash text-xs"></i></button>
                </div>
            </div>

            <!-- AREA TEKS MURNI -->
            <div class="content-scroll relative" id="scroll-container">
                <div id="detail-content" class="editor-box text-xl font-arabic" style="color: #facc15;" contenteditable="false" onblur="saveCurrentContent()"></div>
            </div>
            
            <!-- Tombol Panah Scroll to Top -->
            <button id="btn-scroll-top" onclick="scrollToTop()" class="hidden absolute bottom-8 right-6 bg-gold-500 text-royal-dark w-12 h-12 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.4)] items-center justify-center z-[100] hover:scale-105 transition-transform"><i class="fas fa-arrow-up text-xl"></i></button>
        </div>

    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA40Q6eOPK5vKAq-q9w6OhoCTtanb6GlHI", authDomain: "buku-digital-ngopsin.firebaseapp.com", databaseURL: "https://buku-digital-ngopsin-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "buku-digital-ngopsin", storageBucket: "buku-digital-ngopsin.firebasestorage.app", messagingSenderId: "80687588401", appId: "1:80687588401:web:5bcfcbb2a3398556b16110" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('bukuSakuData');
        const dbCoverRef = database.ref('bukuSakuCover'); 

        let appData = [], isAdmin = false, currentActiveId = null, isEditorActive = false, baseFontSize = 22;
        let savedRange = null;

        let userFavorites = JSON.parse(localStorage.getItem('ngopsinFavorites')) || [];
        let userCustomOrder = JSON.parse(localStorage.getItem('ngopsinOrder')) || [];
        let isReorderMode = false;

        function saveFavorites() { localStorage.setItem('ngopsinFavorites', JSON.stringify(userFavorites)); }
        function saveCustomOrder() { localStorage.setItem('ngopsinOrder', JSON.stringify(userCustomOrder)); }

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            appData = data ? (Array.isArray(data) ? data.filter(i=>i) : Object.values(data).filter(i=>i)) : [];
            if (appData.length === 0) {
                appData = [{ id: 1, title: 'Mukadimah', content: '<div style="text-align: center;"><b style="font-family: \'Playfair Display\'; color: #facc15;">Bismillahirrohmanirrohim</b><br><br>Selamat datang di Buku Saku Digital.</div>' }];
                saveData(); 
            }
            if (document.getElementById('page-toc').classList.contains('active')) renderToc(document.getElementById('search-input').value);
            if (document.getElementById('page-detail').classList.contains('active') && !isEditorActive && currentActiveId) openDetail(currentActiveId);
        });

        let coverData = { title: "Buku Saku", subtitle: "Ngopsin Mabu Park", btnText: "Buka Kitab" };
        dbCoverRef.on('value', (snapshot) => {
            if(snapshot.exists()) {
                coverData = snapshot.val();
                document.getElementById('cover-title').innerText = coverData.title;
                document.getElementById('cover-subtitle').innerText = coverData.subtitle;
                document.getElementById('cover-btnText').innerText = coverData.btnText;
            } else {
                dbCoverRef.set(coverData);
            }
        });

        window.history.replaceState({ page: 'page-cover' }, "", "");
        let lastBackPressTime = 0;

        window.addEventListener('popstate', (e) => {
            closeModal();
            if (e.state && e.state.page) {
                navigateTo(e.state.page, true);
            } else {
                const currentTime = new Date().getTime();
                if (currentTime - lastBackPressTime < 2000) {
                    // Keluar
                } else {
                    showToast("Tekan sekali lagi untuk keluar");
                    lastBackPressTime = currentTime;
                    window.history.pushState({ page: 'page-cover' }, "", "");
                }
            }
        });

        function saveData() { dbRef.set(appData).catch(() => showToast("Gagal menyimpan.")); }
        
        function showToast(msg) {
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        let modalCallback = null;
        function openModal({ title, isInput, isPassword, onConfirm }) {
            document.getElementById('modal-title').innerText = title;
            const inputEl = document.getElementById('modal-input');
            inputEl.value = ''; inputEl.type = isPassword ? 'password' : 'text';
            document.getElementById('modal-input-container').style.display = isInput ? 'block' : 'none';
            document.getElementById('modal-eye-btn').style.display = isPassword ? 'block' : 'none';
            modalCallback = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden'); document.getElementById('custom-modal').classList.add('flex');
            if(isInput) setTimeout(() => inputEl.focus(), 100);
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); document.getElementById('custom-modal').classList.remove('flex'); }
        function toggleModalPassword() {
            const inp = document.getElementById('modal-input'), icn = document.getElementById('modal-eye-icon');
            if(inp.type === 'password') { inp.type = 'text'; icn.className = 'fas fa-eye'; } 
            else { inp.type = 'password'; icn.className = 'fas fa-eye-slash'; }
        }
        document.getElementById('btn-modal-confirm').addEventListener('click', () => { if(modalCallback) modalCallback(document.getElementById('modal-input').value); closeModal(); });

        function updateAdminUI() {
            document.querySelectorAll('.cover-edit-icon').forEach(el => {
                if (isAdmin) { el.classList.remove('hidden'); el.classList.add('flex'); } 
                else { el.classList.add('hidden'); el.classList.remove('flex'); }
            });
            document.getElementById('btn-add-toc').style.display = isAdmin ? 'block' : 'none';
            if(document.getElementById('page-toc').classList.contains('active')) renderToc(document.getElementById('search-input').value);
        }

        function promptAdminLogin() {
            if(isAdmin) {
                isAdmin = false; showToast("Admin Logout.");
                document.getElementById('admin-icon').className = 'fas fa-lock text-sm'; document.getElementById('admin-icon').parentElement.classList.replace('text-gold-500', 'text-slate-600'); 
                updateAdminUI(); return;
            }
            openModal({ title: 'Sandi Admin', isInput: true, isPassword: true, onConfirm: (val) => {
                if(val === 'ngopsinoznet') {
                    isAdmin = true; showToast("Akses Terbuka!");
                    document.getElementById('admin-icon').className = 'fas fa-unlock text-sm'; document.getElementById('admin-icon').parentElement.classList.replace('text-slate-600', 'text-gold-500');
                    updateAdminUI();
                } else showToast("Sandi Salah!");
            }});
        }

        function editCoverData(field) {
            let fieldName = field === 'title' ? 'Judul Utama' : field === 'subtitle' ? 'Subjudul' : 'Teks Tombol';
            openModal({ title: `Ubah ${fieldName}`, isInput: true, onConfirm: (val) => {
                if(val) {
                    coverData[field] = val;
                    dbCoverRef.set(coverData).then(() => showToast('Berhasil disimpan!'));
                }
            }});
            setTimeout(() => document.getElementById('modal-input').value = coverData[field], 50);
        }

        function navigateTo(pageId, isPopState = false) {
            ['page-cover', 'page-toc', 'page-detail'].forEach(id => { 
                document.getElementById(id).classList.remove('active'); 
            });
            document.getElementById(pageId).classList.add('active');
            
            if(pageId === 'page-toc') {
                document.getElementById('search-input').value = ''; 
                isReorderMode = false;
                document.getElementById('btn-reorder-mode').classList.replace('bg-gold-500', 'bg-royal-dark');
                document.getElementById('btn-reorder-mode').classList.replace('text-black', 'text-gold-500');
                renderToc();
            }

            if (!isPopState) {
                window.history.pushState({ page: pageId }, "", "");
            }
        }

        function handleSearch(e) { renderToc(e.target.value); }

        function toggleReorderMode() {
            isReorderMode = !isReorderMode;
            const btn = document.getElementById('btn-reorder-mode');
            if(isReorderMode) {
                btn.classList.replace('bg-royal-dark', 'bg-gold-500');
                btn.classList.replace('text-gold-500', 'text-black');
                showToast("Mode Susun Aktif");
            } else {
                btn.classList.replace('bg-gold-500', 'bg-royal-dark');
                btn.classList.replace('text-black', 'text-gold-500');
            }
            renderToc(document.getElementById('search-input').value);
        }

        function moveItem(id, direction, e) {
            e.stopPropagation();
            appData.forEach(item => { if(!userCustomOrder.includes(item.id)) userCustomOrder.push(item.id); });

            const index = userCustomOrder.indexOf(id);
            if (index < 0) return;

            if (direction === 'up' && index > 0) {
                [userCustomOrder[index - 1], userCustomOrder[index]] = [userCustomOrder[index], userCustomOrder[index - 1]];
            } else if (direction === 'down' && index < userCustomOrder.length - 1) {
                [userCustomOrder[index + 1], userCustomOrder[index]] = [userCustomOrder[index], userCustomOrder[index + 1]];
            }
            
            saveCustomOrder();
            renderToc(document.getElementById('search-input').value);
        }

        function renderToc(searchQuery = '') {
            const container = document.getElementById('toc-container'); container.innerHTML = '';
            
            let sortedData = [...appData];
            if(userCustomOrder.length > 0) {
                sortedData.sort((a, b) => {
                    let indexA = userCustomOrder.indexOf(a.id);
                    let indexB = userCustomOrder.indexOf(b.id);
                    if (indexA === -1) indexA = 999999;
                    if (indexB === -1) indexB = 999999;
                    return indexA - indexB;
                });
            }

            const filteredData = sortedData.filter(item => {
                if(!item) return false;
                if(!isAdmin && item.hidden) return false; 
                const title = (item.title || '').toLowerCase();
                return title.includes(searchQuery.toLowerCase());
            });

            if(filteredData.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-10 font-serif italic">Data tidak ditemukan...</div>`;
                return;
            }

            let validCounter = 1; 

            filteredData.forEach((item) => {
                let displayNum = (isAdmin && item.hidden) ? '-' : validCounter++;
                
                const btn = document.createElement('div');
                btn.className = 'bg-royal-dark/60 border border-gold-500/20 p-4 rounded-xl shadow-md flex items-center justify-between hover:bg-royal-base transition-colors';
                
                let titleClass = item.hidden ? 'text-slate-500 italic line-through' : 'text-slate-100';
                let favIndicator = userFavorites.includes(item.id) ? `<i class="fas fa-heart text-red-500 ml-2 text-[10px] transform -translate-y-1"></i>` : '';

                let titleHTML = `
                    <div class="flex items-center flex-grow cursor-pointer" onclick="openDetail(${item.id})">
                        <div class="w-8 h-8 rounded-full bg-gold-500/10 text-gold-400 flex items-center justify-center font-bold text-sm mr-3 border border-gold-500/30 flex-shrink-0">${displayNum}</div>
                        <span class="font-serif ${titleClass}">${(item.title||'').replace(/^\d+[\.\-]?\s*/, '')}</span> ${favIndicator}
                    </div>
                `;

                let actionHTML = '';
                
                if (isReorderMode) {
                    actionHTML = `
                        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
                            <button onclick="moveItem(${item.id}, 'up', event)" class="w-8 h-8 rounded-full bg-royal-dark text-gold-400 flex items-center justify-center border border-gold-500/30 hover:bg-gold-500 hover:text-black transition-colors"><i class="fas fa-arrow-up"></i></button>
                            <button onclick="moveItem(${item.id}, 'down', event)" class="w-8 h-8 rounded-full bg-royal-dark text-gold-400 flex items-center justify-center border border-gold-500/30 hover:bg-gold-500 hover:text-black transition-colors"><i class="fas fa-arrow-down"></i></button>
                        </div>
                    `;
                } else if (isAdmin) {
                    let eyeIcon = item.hidden ? 'fa-eye-slash text-slate-500' : 'fa-eye text-gold-500/80 hover:text-gold-400';
                    actionHTML = `
                        <div class="flex items-center gap-4 flex-shrink-0 ml-3">
                            <button onclick="toggleVisibility(${item.id}, event)" class="p-1 transition-colors" title="Sembunyikan/Tampilkan">
                                <i class="fas ${eyeIcon}"></i>
                            </button>
                            <button onclick="promptDeleteToc(${item.id}, event)" class="p-1 text-red-500/80 hover:text-red-400 transition-colors" title="Hapus Doa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                } else {
                    actionHTML = `<i class="fas fa-chevron-right text-gold-500/50 text-xs ml-3"></i>`;
                }

                btn.innerHTML = titleHTML + actionHTML;
                container.appendChild(btn);
            });
        }

        // ============ FUNGSI HAPUS & SEMBUNYIKAN (DIKEMBALIKAN) ============
        function toggleVisibility(id, e) {
            e.stopPropagation();
            const item = appData.find(x => x.id === id);
            if(item) {
                item.hidden = !item.hidden;
                saveData();
                showToast(item.hidden ? 'Doa disembunyikan' : 'Doa ditampilkan');
                renderToc(document.getElementById('search-input').value);
            }
        }

        function promptDeleteToc(id, e) {
            e.stopPropagation();
            openModal({ title: 'Hapus Doa Ini Secara Permanen?', isInput: false, onConfirm: () => {
                appData = appData.filter(x => x.id !== id); 
                saveData(); 
                showToast('Doa Berhasil Dihapus!');
                renderToc(document.getElementById('search-input').value);
            }});
        }

        // ============ FUNGSI TAMBAH BARU (DIKEMBALIKAN) ============
        function promptNewToc() {
            openModal({ title: 'Tambah Doa', isInput: true, onConfirm: (val) => {
                if(val) { 
                    appData.push({ id: Date.now(), title: val, content: '<div style="text-align:center;">Ketik di sini...</div>', hidden: false }); 
                    saveData(); 
                    showToast('Ditambahkan!'); 
                    renderToc(document.getElementById('search-input').value);
                }
            }});
        }


        function toggleFavoriteCurrent() {
            if(!currentActiveId) return;
            const index = userFavorites.indexOf(currentActiveId);
            if(index > -1) {
                userFavorites.splice(index, 1);
                showToast("Dihapus dari Favorit");
            } else {
                userFavorites.push(currentActiveId);
                showToast("Ditambahkan ke Favorit");
            }
            saveFavorites();
            updateFavoriteBtnUI();
        }

        function updateFavoriteBtnUI() {
            const btnFav = document.getElementById('btn-favorite');
            if(userFavorites.includes(currentActiveId)) {
                btnFav.innerHTML = '<i class="fas fa-heart text-red-500"></i> <span class="text-slate-300">Favorit</span>';
                btnFav.classList.add('border-red-500/50');
            } else {
                btnFav.innerHTML = '<i class="far fa-heart text-gold-500"></i> <span class="text-slate-300">Favorit</span>';
                btnFav.classList.remove('border-red-500/50');
            }
        }

        function shareCurrentDoa() {
            const item = appData.find(x => x.id === currentActiveId);
            if(!item) return;
            let cleanTitle = (item.title||'').replace(/^\d+[\.\-]?\s*/, '');
            let shareText = `Baca ${cleanTitle} di Buku Saku Digital Ngopsin.`;
            
            if (navigator.share) {
                navigator.share({
                    title: cleanTitle,
                    text: shareText,
                    url: window.location.href
                }).catch(err => console.log('Share error:', err));
            } else {
                navigator.clipboard.writeText(shareText + " " + window.location.href);
                showToast("Teks & Link disalin!");
            }
        }

        function openDetail(id) {
            currentActiveId = id; const item = appData.find(x => x.id === id); if(!item) return;
            document.getElementById('detail-title').innerText = (item.title||'').replace(/^\d+[\.\-]?\s*/, '');
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = item.content || ""; contentEl.style.fontSize = baseFontSize + 'px';
            if(contentEl.dataset.lh) changeLineHeightGlobal(contentEl.dataset.lh);
            document.getElementById('btn-edit-mode').style.display = isAdmin ? 'block' : 'none';
            isEditorActive = false;
            document.getElementById('reader-features').classList.replace('hidden', 'flex');
            document.getElementById('admin-features').classList.replace('flex', 'hidden');
            document.getElementById('edit-icon').className = 'fas fa-pen';
            document.getElementById('btn-edit-mode').classList.replace('text-gold-400', 'text-slate-500');
            contentEl.setAttribute('contenteditable', 'false');
            updateFavoriteBtnUI(); 
            navigateTo('page-detail');
        }

        // ============ SCROLL TO TOP & AUTO SCROLL ============
        const scrollContainer = document.getElementById('scroll-container');
        const btnScrollTop = document.getElementById('btn-scroll-top');

        scrollContainer.addEventListener('scroll', function() {
            // Sensor Pintar: Muncul jika layar di-scroll melebihi 80% dari TINGGI LAYAR HP (Bukan panjang teks)
            if (this.scrollTop > (this.clientHeight * 0.8)) {
                btnScrollTop.classList.remove('hidden');
                btnScrollTop.classList.add('flex');
            } else {
                btnScrollTop.classList.remove('flex');
                btnScrollTop.classList.add('hidden');
            }
        });

        function scrollToTop() {
            scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
        }

        let scrollInterval, isScrolling = false;
        function toggleAutoScroll() {
            const btn = document.getElementById('btn-autoscroll');
            if (isScrolling) { 
                clearInterval(scrollInterval); 
                isScrolling = false; 
                btn.classList.replace('text-gold-400', 'text-slate-300'); 
            } else { 
                isScrolling = true; 
                btn.classList.replace('text-slate-300', 'text-gold-400'); 
                scrollInterval = setInterval(() => { 
                    scrollContainer.scrollBy({ top: 1, left: 0, behavior: 'auto' }); 
                }, 50); 
            }
        }

        // ============ EDITOR HACKS: ANTI LOMPAT & MEMORI ============
        const editorContent = document.getElementById('detail-content');

        function toggleEditor() {
            isEditorActive = !isEditorActive;
            const rBar = document.getElementById('reader-features'), aBar = document.getElementById('admin-features'), btnEdit = document.getElementById('btn-edit-mode'), iconEdit = document.getElementById('edit-icon');
            if (isEditorActive) {
                rBar.classList.replace('flex', 'hidden'); aBar.classList.replace('hidden', 'flex');
                iconEdit.className = 'fas fa-save'; btnEdit.classList.replace('text-slate-500', 'text-gold-400');
                editorContent.setAttribute('contenteditable', 'true'); 
                showToast("Mode Edit Aktif.");
            } else {
                aBar.classList.replace('flex', 'hidden'); rBar.classList.replace('hidden', 'flex');
                iconEdit.className = 'fas fa-pen'; btnEdit.classList.replace('text-gold-400', 'text-slate-500');
                editorContent.setAttribute('contenteditable', 'false'); saveCurrentContent(); showToast("Tersimpan.");
            }
        }

        function updateFontSizeDisplay() {
            if(!savedRange || !isEditorActive) return;
            let node = savedRange.startContainer;
            let parentEl = node.nodeType === 3 ? node.parentElement : node;
            if(parentEl) {
                let size = window.getComputedStyle(parentEl).fontSize;
                document.getElementById('font-size-display').innerText = parseInt(size) + 'px';
            }
        }

        document.addEventListener('selectionchange', () => {
            if (!isEditorActive) return;
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editorContent.contains(range.commonAncestorContainer)) {
                    savedRange = range.cloneRange();
                    if(!range.collapsed) updateFontSizeDisplay();
                }
            }
        });

        function getSavedSelection() {
            if (savedRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
                return sel;
            }
            return window.getSelection();
        }

        function execCmd(command, value = null) {
            getSavedSelection();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            document.execCommand('styleWithCSS', false, true);
            document.execCommand(command, false, value);
            saveCurrentContent();
        }

        function changeColor(color) {
            if(!color) return;
            getSavedSelection();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, color);
            saveCurrentContent();
        }

        function changeFontFamily(fontName) {
            if(!fontName) return;
            getSavedSelection();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('fontName', false, fontName);
            
            editorContent.querySelectorAll('font[face]').forEach(el => {
                el.style.fontFamily = el.getAttribute('face');
                el.removeAttribute('face');
            });
            saveCurrentContent();
        }

        function changeSelectedFontSize(step) {
            getSavedSelection();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");

            let node = savedRange.startContainer;
            let parentEl = node.nodeType === 3 ? node.parentElement : node;
            
            let currentSize = parseInt(window.getComputedStyle(parentEl).fontSize) || 22;
            let newSize = currentSize + step;
            if (newSize < 8) newSize = 8;
            if (newSize > 40) newSize = 40;

            document.execCommand("styleWithCSS", false, false);
            document.execCommand("fontSize", false, "7");
            
            editorContent.querySelectorAll('font[size="7"]').forEach(f => {
                f.removeAttribute('size');
                f.style.fontSize = newSize + 'px';
            });
            
            editorContent.querySelectorAll('*').forEach(el => {
                let fs = el.style.fontSize;
                if(fs === '-webkit-xxx-large' || fs === 'xx-large' || fs === '48px' || el.getAttribute('size') === '7') {
                    el.style.fontSize = newSize + 'px';
                    el.removeAttribute('size');
                }
            });

            document.execCommand("styleWithCSS", false, true);
            document.getElementById('font-size-display').innerText = newSize + 'px';
            savedRange = window.getSelection().getRangeAt(0).cloneRange();
            saveCurrentContent();
        }

        function changeLineHeight() {
            getSavedSelection();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            
            const lhSequence = [1.0, 1.5, 2.0, 2.5, 3.0]; 
            let node = savedRange.commonAncestorContainer;
            let blockNode = node.nodeType === 3 ? node.parentElement : node;
            
            while (blockNode && blockNode.id !== 'detail-content' && !['DIV', 'P'].includes(blockNode.tagName)) {
                blockNode = blockNode.parentElement;
            }
            if (!blockNode) blockNode = editorContent;

            let currentInline = parseFloat(blockNode.style.lineHeight) || parseFloat(blockNode.dataset.lh) || 2.0;
            let nextIndex = lhSequence.indexOf(currentInline) + 1;
            if (nextIndex >= lhSequence.length || nextIndex < 0) nextIndex = 0;
            
            let newLH = lhSequence[nextIndex];
            blockNode.style.lineHeight = newLH;
            blockNode.dataset.lh = newLH; 
            
            showToast(`Spasi Paragraf: ${newLH}`);
            saveCurrentContent();
        }

        // ============ FUNGSI A- A+ PEMBACA (RESTORED) ============
        function changeGlobalFontSize(step) {
            baseFontSize += step; 
            if(baseFontSize < 14) baseFontSize = 14; 
            if(baseFontSize > 60) baseFontSize = 60;
            
            editorContent.style.fontSize = baseFontSize + 'px';
            editorContent.querySelectorAll('*').forEach(el => {
                if(el.style.fontSize) {
                    let current = parseInt(el.style.fontSize);
                    if(current) {
                        let ns = current + step;
                        if(ns < 8) ns = 8; if(ns > 60) ns = 60;
                        el.style.fontSize = ns + 'px';
                    }
                }
            });
            saveCurrentContent();
        }

        function changeLineHeightGlobal(lh) {
            editorContent.dataset.lh = lh;
            let styleTag = document.getElementById('force-line-height');
            if(!styleTag) { styleTag = document.createElement('style'); styleTag.id = 'force-line-height'; document.head.appendChild(styleTag); }
            styleTag.innerHTML = `#detail-content, #detail-content * { line-height: ${lh} !important; }`;
        }

        function saveCurrentContent() {
            if(!currentActiveId || !isAdmin) return;
            const itemIndex = appData.findIndex(x => x.id === currentActiveId);
            if(itemIndex > -1) { appData[itemIndex].content = editorContent.innerHTML; saveData(); }
        }
        editorContent.addEventListener('input', () => { if(isEditorActive) saveCurrentContent(); });

        function promptEditTitle() {
            if(!isEditorActive) return showToast("Aktifkan mode edit.");
            const item = appData.find(x => x.id === currentActiveId); if(!item) return;
            openModal({ title: 'Ubah Judul', isInput: true, onConfirm: (val) => {
                if(val){ item.title = val; document.getElementById('detail-title').innerText = val; saveData(); showToast('Berhasil diubah!'); }
            }});
            setTimeout(() => document.getElementById('modal-input').value = item.title, 50);
        }
        
        function promptDeleteCurrent() {
            openModal({ title: 'Hapus Halaman?', isInput: false, onConfirm: () => {
                appData = appData.filter(x => x.id !== currentActiveId); saveData(); 
                window.history.back();
                showToast('Dihapus!');
            }});
        }

        let wakeLock = null;
        async function toggleWakeLock() {
            const btn = document.getElementById('btn-wakelock');
            if ('wakeLock' in navigator) {
                try {
                    if (wakeLock) { await wakeLock.release(); wakeLock = null; btn.classList.replace('text-gold-400', 'text-slate-300'); } 
                    else { wakeLock = await navigator.wakeLock.request('screen'); btn.classList.replace('text-slate-300', 'text-gold-400'); wakeLock.addEventListener('release', () => { wakeLock = null; btn.classList.replace('text-gold-400', 'text-slate-300'); }); }
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
