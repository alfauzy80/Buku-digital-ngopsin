<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Saku Digital - Ngopsin Mabu Park</title>
    
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lateef&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], arabic: ['Amiri', 'serif'] },
                    colors: {
                        navy: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #0f172a; /* Warna Navy Gelap nan Elegan */
            color: #e2e8f0;
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Desain Glassmorphism Mewah untuk Header */
        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .content-area { 
            outline: none; 
            min-height: 600px; 
        }
        .content-area[contenteditable="true"]:focus { 
            border: 1px dashed rgba(234, 179, 8, 0.5); 
            border-radius: 8px; 
            padding: 8px;
            background: rgba(255, 255, 255, 0.03); 
        }

        /* HEADER ANTI HILANG SAAT KEYBOARD MUNCUL */
        .absolute-fixed-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }

        /* Mencegah teks tertutup header yang melayang */
        .content-padding-top {
            padding-top: 140px; /* Jarak aman dari header + toolbar */
            padding-bottom: 100px;
        }

        /* Styling Scrollbar Elegan */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #eab308; }
        
        .glow-text { text-shadow: 0 0 15px rgba(234, 179, 8, 0.5); }
    </style>
</head>
<body class="selection:bg-gold-600 selection:text-white relative font-sans">

    <!-- Toast Notifikasi Elegan -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-navy-800 border border-gold-600 text-gold-400 px-6 py-3 rounded-full shadow-[0_0_20px_rgba(0,0,0,0.8)] z-[10000] transition-opacity duration-300 opacity-0 pointer-events-none font-semibold text-sm tracking-wide">
        Pesan
    </div>

    <!-- MODAL -->
    <div id="custom-modal" class="fixed inset-0 bg-black/80 z-[10000] hidden items-center justify-center backdrop-blur-md px-4">
        <div class="bg-navy-900 border border-gold-600/30 rounded-2xl shadow-2xl p-6 w-full max-w-sm transform transition-all">
            <h3 id="modal-title" class="text-xl font-bold text-gold-400 mb-4 tracking-wide">Judul</h3>
            <div class="relative w-full mb-6" id="modal-input-container">
                <input type="text" id="modal-input" class="w-full px-4 py-3 bg-navy-950 border border-slate-700 rounded-lg outline-none text-white focus:border-gold-500 focus:ring-1 focus:ring-gold-500 transition-colors">
                <button id="modal-eye-btn" class="absolute right-4 top-3.5 text-slate-400 hidden" onclick="toggleModalPassword()"><i class="fas fa-eye-slash" id="modal-eye-icon"></i></button>
            </div>
            <p id="modal-desc" class="hidden text-slate-300 mb-6">Deskripsi</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 font-medium transition-colors">Batal</button>
                <button id="btn-modal-confirm" class="px-5 py-2.5 rounded-lg bg-gradient-to-r from-gold-600 to-gold-500 hover:from-gold-500 hover:to-gold-400 text-navy-950 font-bold shadow-lg transition-all">Simpan</button>
            </div>
        </div>
    </div>

    <!-- WADAH UTAMA -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-navy-900 shadow-2xl relative">
        
        <!-- ================= HALAMAN 1: COVER (ELEGAN & MEWAH) ================= -->
        <div id="page-cover" class="flex flex-col items-center justify-center p-6 text-center bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-navy-950 min-h-screen relative w-full">
            
            <!-- Ornamen Elegan (Tidak berantakan) -->
            <div class="absolute top-16 opacity-80">
                <i class="fas fa-moon text-7xl text-gold-500 drop-shadow-[0_0_30px_rgba(234,179,8,0.4)]"></i>
            </div>
            
            <div class="z-10 mt-32">
                <h1 class="text-4xl font-bold text-gold-400 mb-3 font-arabic tracking-widest glow-text">BUKU SAKU</h1>
                <h2 class="text-2xl font-light text-white mb-2 tracking-[0.2em]">DIGITAL</h2>
                <div class="w-16 h-0.5 bg-gradient-to-r from-transparent via-gold-500 to-transparent mx-auto mb-6"></div>
                <p class="text-sm text-slate-400 tracking-widest uppercase font-semibold">Ngopsin Mabu Park</p>
            </div>

            <button onclick="navigateTo('page-toc')" class="z-10 mt-16 bg-navy-800 border border-gold-600/50 hover:border-gold-400 text-gold-400 font-semibold py-3.5 px-10 rounded-full shadow-[0_0_20px_rgba(0,0,0,0.3)] transition-all flex items-center gap-3">
                BUKA BUKU <i class="fas fa-chevron-right text-sm"></i>
            </button>

            <!-- Login Admin (Rahasia) -->
            <button onclick="promptAdminLogin()" class="absolute bottom-8 z-10 p-3 text-slate-700 hover:text-gold-600 transition-colors">
                <i id="admin-icon" class="fas fa-lock text-sm"></i>
            </button>
        </div>

        <!-- ================= HALAMAN 2: DAFTAR ISI ================= -->
        <div id="page-toc" class="hidden flex-col w-full min-h-screen">
            <!-- Header Fixed -->
            <header class="absolute-fixed-top max-w-md mx-auto glass-header p-4">
                <div class="flex justify-between items-center">
                    <button onclick="navigateTo('page-cover')" class="text-gold-500 text-xl"><i class="fas fa-arrow-left"></i></button>
                    <h1 class="text-lg font-bold text-white tracking-widest">DAFTAR ISI</h1>
                    <div class="w-6"></div> <!-- Spacer -->
                </div>
            </header>

            <main class="px-6 pt-24 pb-10">
                <div class="flex items-center justify-between mb-8">
                    <div class="w-10 h-0.5 bg-gold-500"></div>
                    <button id="btn-add-toc" onclick="promptNewToc()" class="hidden bg-gold-600 text-navy-900 rounded-full w-8 h-8 flex items-center justify-center shadow-lg"><i class="fas fa-plus"></i></button>
                </div>
                
                <div id="toc-container" class="space-y-4">
                    <div class="text-center text-slate-500 py-4 text-sm animate-pulse">Memuat data...</div>
                </div>
            </main>
        </div>

        <!-- ================= HALAMAN 3: KONTEN (ANTI KEYBOARD BUG) ================= -->
        <div id="page-detail" class="hidden flex-col w-full min-h-screen relative">
            
            <!-- WADAH HEADER FIXED (DICOR MATI DI ATAS LAYAR) -->
            <div class="absolute-fixed-top max-w-md mx-auto glass-header flex flex-col w-full transition-all duration-300">
                
                <!-- Baris 1: Navigasi -->
                <div class="flex justify-between items-center p-4 border-b border-white/5">
                    <button onclick="navigateTo('page-toc')" class="text-gold-500 text-xl"><i class="fas fa-arrow-left"></i></button>
                    <h1 id="detail-title" class="text-base font-bold text-white truncate max-w-[200px]" ondblclick="if(isAdmin) promptEditTitle()">Judul</h1>
                    <!-- Tombol Edit hanya muncul untuk admin -->
                    <button id="btn-edit-mode" onclick="toggleEditor()" class="text-slate-400 hidden"><i id="edit-icon" class="fas fa-pen text-lg"></i></button>
                </div>

                <!-- Baris 2A: MENU PEMBACA (Hilang total saat Edit) -->
                <div id="reader-features" class="flex overflow-x-auto gap-2 p-2 bg-navy-900/50 text-sm no-scrollbar">
                    <button onclick="changeFontSize(-2)" class="px-4 py-1.5 bg-navy-800 text-white rounded border border-slate-700 font-bold flex-shrink-0">A-</button>
                    <button onclick="changeFontSize(2)" class="px-4 py-1.5 bg-navy-800 text-white rounded border border-slate-700 font-bold flex-shrink-0">A+</button>
                    <button onclick="toggleWakeLock()" id="btn-wakelock" class="px-3 py-1.5 bg-navy-800 text-slate-300 rounded flex items-center gap-2 border border-slate-700 flex-shrink-0"><i class="fas fa-lightbulb text-gold-500"></i> Layar</button>
                    <button onclick="toggleAutoScroll()" id="btn-autoscroll" class="px-3 py-1.5 bg-navy-800 text-slate-300 rounded flex items-center gap-2 border border-slate-700 flex-shrink-0"><i class="fas fa-angle-double-down text-gold-500"></i> Scroll</button>
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-navy-800 rounded border border-slate-700 flex-shrink-0">
                        <i class="fas fa-music text-gold-500 text-xs"></i>
                        <audio id="bg-audio" controls class="h-6 w-32 outline-none invert opacity-80">
                            <source src="https://www.soundhelix.com/architectureplay/SoundHelix-Song-1.mp3" type="audio/mpeg">
                        </audio>
                    </div>
                </div>

                <!-- Baris 2B: MENU ADMIN (Muncul khusus saat Edit, Tidak Hilang oleh Keyboard) -->
                <div id="admin-features" class="hidden flex-wrap gap-1 p-2 bg-navy-950 text-slate-200 text-sm border-t border-gold-600/20">
                    <button onclick="execCmd('undo')" class="px-2.5 py-1.5 bg-navy-800 rounded hover:bg-slate-700"><i class="fas fa-undo"></i></button>
                    <button onclick="execCmd('redo')" class="px-2.5 py-1.5 bg-navy-800 rounded hover:bg-slate-700"><i class="fas fa-redo"></i></button>
                    <div class="w-px h-5 bg-slate-700 mx-1 self-center"></div>

                    <button onclick="execCmd('bold')" class="px-2.5 py-1.5 bg-navy-800 rounded font-bold hover:bg-slate-700">B</button>
                    <button onclick="execCmd('italic')" class="px-2.5 py-1.5 bg-navy-800 rounded italic hover:bg-slate-700">I</button>
                    <button onclick="execCmd('underline')" class="px-2.5 py-1.5 bg-navy-800 rounded underline hover:bg-slate-700">U</button>
                    <div class="w-px h-5 bg-slate-700 mx-1 self-center"></div>
                    
                    <button onclick="execCmd('justifyLeft')" class="px-2.5 py-1.5 bg-navy-800 rounded hover:bg-slate-700"><i class="fas fa-align-left"></i></button>
                    <button onclick="execCmd('justifyCenter')" class="px-2.5 py-1.5 bg-navy-800 rounded hover:bg-slate-700"><i class="fas fa-align-center"></i></button>
                    <button onclick="execCmd('justifyRight')" class="px-2.5 py-1.5 bg-navy-800 rounded hover:bg-slate-700"><i class="fas fa-align-right"></i></button>
                    <div class="w-px h-5 bg-slate-700 mx-1 self-center"></div>
                    
                    <select onchange="execCmd('fontName', this.value)" class="px-2 py-1.5 bg-navy-800 rounded outline-none max-w-[90px] border border-slate-700">
                        <option value="Poppins">Poppins</option>
                        <option value="Amiri">Amiri</option>
                        <option value="Lateef">Lateef</option>
                        <option value="'Scheherazade New'">Scheherazade</option>
                    </select>
                    
                    <input type="color" onchange="execCmd('foreColor', this.value)" class="w-8 h-8 p-0 border-0 rounded bg-transparent cursor-pointer ml-1" title="Warna Teks">
                    
                    <button onclick="changeLineHeight()" class="px-2.5 py-1.5 bg-navy-800 rounded hover:bg-slate-700 ml-1 text-gold-400"><i class="fas fa-text-height"></i></button>
                    
                    <div class="w-px h-5 bg-slate-700 mx-1 self-center flex-grow"></div>
                    <button onclick="promptDeleteCurrent()" class="px-2.5 py-1.5 bg-red-900/50 text-red-400 rounded hover:bg-red-800">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <!-- AREA KONTEN (Diberi padding-top agar tidak tertutup header) -->
            <main class="w-full flex-grow content-padding-top px-6">
                <!-- Teks utama di-set ke warna emas pudar sebagai default -->
                <div id="detail-content" class="content-area text-lg leading-relaxed text-gold-400/90" contenteditable="false" onblur="saveCurrentContent()"></div>
            </main>
        </div>
    </div>

    <!-- JAVASCRIPT & FIREBASE -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA40Q6eOPK5vKAq-q9w6OhoCTtanb6GlHI",
            authDomain: "buku-digital-ngopsin.firebaseapp.com",
            databaseURL: "https://buku-digital-ngopsin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "buku-digital-ngopsin",
            storageBucket: "buku-digital-ngopsin.firebasestorage.app",
            messagingSenderId: "80687588401",
            appId: "1:80687588401:web:5bcfcbb2a3398556b16110"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let appData = [];
        let isAdmin = false;
        let currentActiveId = null;
        let isEditorActive = false;
        let baseFontSize = 18;

        const dbRef = database.ref('bukuSakuData');
        
        dbRef.on('value', (snapshot) => {
            try {
                const data = snapshot.val();
                if (data && Array.isArray(data)) { appData = data.filter(item => item !== null); } 
                else if (data && typeof data === 'object') { appData = Object.values(data).filter(item => item !== null); } 
                else { appData = []; }

                if (appData.length === 0) {
                    appData = [{ id: 1, title: '1. Mukadimah', content: '<div style="text-align: center; line-height: 1.6; color: #facc15;"><b>Bismillahirrohmanirrohim</b><br><br>Selamat datang di Buku Saku Digital.</div>' }];
                    saveData(); 
                }

                if (!document.getElementById('page-toc').classList.contains('hidden')) renderToc();
                if (!document.getElementById('page-detail').classList.contains('hidden') && !isEditorActive) {
                    if(currentActiveId) openDetail(currentActiveId);
                }
            } catch (err) {}
        });

        function saveData() { dbRef.set(appData).catch(() => showToast("Gagal menyimpan ke server.")); }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        let modalCallback = null;
        function openModal({ title, isInput, isPassword, placeholder, desc, btnText, onConfirm }) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-input-container').classList.toggle('hidden', !isInput);
            document.getElementById('modal-desc').classList.toggle('hidden', isInput);
            
            if(isInput) {
                const inputEl = document.getElementById('modal-input');
                inputEl.placeholder = placeholder || '';
                inputEl.value = '';
                inputEl.type = isPassword ? 'password' : 'text';
                document.getElementById('modal-eye-btn').classList.toggle('hidden', !isPassword);
                document.getElementById('modal-eye-icon').className = 'fas fa-eye-slash';
                setTimeout(() => inputEl.focus(), 100);
            } else { document.getElementById('modal-desc').innerText = desc || ''; }
            
            document.getElementById('btn-modal-confirm').innerText = btnText || 'Simpan';
            modalCallback = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('flex');
            modalCallback = null;
        }

        function toggleModalPassword() {
            const input = document.getElementById('modal-input');
            const icon = document.getElementById('modal-eye-icon');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye-slash'; }
        }

        document.getElementById('btn-modal-confirm').addEventListener('click', () => {
            if (modalCallback) modalCallback(document.getElementById('modal-input').value);
            closeModal();
        });

        function promptAdminLogin() {
            if(isAdmin) {
                isAdmin = false; showToast("Logout Admin Berhasil.");
                document.getElementById('admin-icon').className = 'fas fa-lock text-sm';
                document.getElementById('admin-icon').parentElement.classList.remove('text-gold-500');
                document.getElementById('admin-icon').parentElement.classList.add('text-slate-700');
                return;
            }
            openModal({
                title: 'Otorisasi Admin', isInput: true, isPassword: true, placeholder: 'Masukkan sandi...',
                onConfirm: (val) => {
                    if(val === 'ngopsinoznet') {
                        isAdmin = true; showToast("Akses Admin Dibuka!");
                        document.getElementById('admin-icon').className = 'fas fa-unlock text-sm';
                        document.getElementById('admin-icon').parentElement.classList.remove('text-slate-700');
                        document.getElementById('admin-icon').parentElement.classList.add('text-gold-500');
                    } else showToast("Sandi tidak valid!");
                }
            });
        }

        function navigateTo(pageId) {
            ['page-cover', 'page-toc', 'page-detail'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            document.getElementById(pageId).classList.remove('hidden');
            document.getElementById(pageId).classList.add('flex');
            if (pageId === 'page-toc') { renderToc(); stopAutoScroll(); }
            window.scrollTo(0, 0); 
        }

        function renderToc() {
            const container = document.getElementById('toc-container');
            container.innerHTML = '';
            document.getElementById('btn-add-toc').classList.toggle('hidden', !isAdmin);

            appData.forEach((item, index) => {
                if(!item) return;
                const btn = document.createElement('div');
                btn.className = 'flex items-center justify-between bg-navy-800 p-4 rounded-xl shadow-md border-l-4 border-gold-600 cursor-pointer hover:bg-navy-700 transition-colors';
                btn.onclick = () => openDetail(item.id);
                const titleSpan = document.createElement('span');
                titleSpan.className = 'font-semibold text-lg text-slate-200 w-full tracking-wide';
                let titleText = item.title ? item.title.toString() : "Halaman Baru";
                titleSpan.innerText = `${index + 1}. ${titleText.replace(/^\d+[\.\-]?\s*/, '')}`;
                btn.appendChild(titleSpan);
                container.appendChild(btn);
            });
        }

        function promptNewToc() {
            openModal({
                title: 'Tambah Doa Baru', isInput: true, placeholder: 'Ketik judul doa...',
                onConfirm: (val) => {
                    if (val && val.trim() !== "") {
                        appData.push({ id: Date.now(), title: val, content: '<div style="text-align:center; line-height: 1.6; color: #facc15;">Mulai ketik di sini...</div>' });
                        saveData(); showToast('Halaman berhasil ditambahkan!');
                    }
                }
            });
        }

        function openDetail(id) {
            currentActiveId = id;
            const item = appData.find(x => x.id === id);
            if (!item) return;

            document.getElementById('detail-title').innerText = (item.title||"").toString().replace(/^\d+[\.\-]?\s*/, '');
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = item.content || "";
            contentEl.style.fontSize = baseFontSize + 'px';

            document.getElementById('btn-edit-mode').classList.toggle('hidden', !isAdmin);
            
            // Atur ulang ke mode baca
            isEditorActive = false;
            document.getElementById('reader-features').classList.remove('hidden');
            document.getElementById('reader-features').classList.add('flex');
            document.getElementById('admin-features').classList.add('hidden');
            document.getElementById('admin-features').classList.remove('flex');
            
            const btnEdit = document.getElementById('btn-edit-mode');
            const iconEdit = document.getElementById('edit-icon');
            iconEdit.className = 'fas fa-pen text-lg';
            btnEdit.classList.remove('text-green-400');
            btnEdit.classList.add('text-slate-400');
            
            contentEl.setAttribute('contenteditable', 'false');

            navigateTo('page-detail');
        }

        function promptEditTitle() {
            if(!isEditorActive) { showToast("Aktifkan mode edit (Ikon Pensil) dulu."); return; }
            const item = appData.find(x => x.id === currentActiveId);
            if(!item) return;
            openModal({
                title: 'Ubah Judul', isInput: true, placeholder: 'Ketik judul baru...',
                onConfirm: (val) => {
                    if(val) {
                        item.title = val;
                        document.getElementById('detail-title').innerText = val.replace(/^\d+[\.\-]?\s*/, '');
                        saveData(); showToast('Judul berhasil diubah!');
                    }
                }
            });
            setTimeout(() => { document.getElementById('modal-input').value = (item.title||"").toString().replace(/^\d+[\.\-]?\s*/, ''); }, 50);
        }

        function promptDeleteCurrent() {
            openModal({
                title: 'Peringatan Hapus', isInput: false, desc: 'Anda yakin ingin menghapus doa ini secara permanen?', btnText: 'Hapus Permanen',
                onConfirm: () => {
                    appData = appData.filter(x => x.id !== currentActiveId);
                    saveData(); navigateTo('page-toc'); showToast('Halaman dihapus.');
                }
            });
        }

        // SISTEM TUKAR MENU SUPER AMAN
        function toggleEditor() {
            isEditorActive = !isEditorActive;
            const readerBar = document.getElementById('reader-features');
            const adminBar = document.getElementById('admin-features');
            const contentEl = document.getElementById('detail-content');
            const btnEdit = document.getElementById('btn-edit-mode');
            const iconEdit = document.getElementById('edit-icon');
            
            if (isEditorActive) {
                // Sembunyikan Pembaca, Tampilkan Admin
                readerBar.classList.remove('flex'); readerBar.classList.add('hidden');
                adminBar.classList.remove('hidden'); adminBar.classList.add('flex');
                
                iconEdit.className = 'fas fa-save text-xl';
                btnEdit.classList.remove('text-slate-400'); btnEdit.classList.add('text-green-400');
                
                contentEl.setAttribute('contenteditable', 'true');
                contentEl.focus(); showToast("Mode Edit Aktif.");
            } else {
                // Sembunyikan Admin, Tampilkan Pembaca
                adminBar.classList.remove('flex'); adminBar.classList.add('hidden');
                readerBar.classList.remove('hidden'); readerBar.classList.add('flex');
                
                iconEdit.className = 'fas fa-pen text-lg';
                btnEdit.classList.remove('text-green-400'); btnEdit.classList.add('text-slate-400');
                
                contentEl.setAttribute('contenteditable', 'false');
                saveCurrentContent(); showToast("Tersimpan ke Cloud.");
            }
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('detail-content').focus();
            saveCurrentContent();
        }

        function changeLineHeight() {
            const contentEl = document.getElementById('detail-content');
            let currentLH = parseFloat(contentEl.style.lineHeight) || 1.6;
            let nextLH = currentLH === 1.6 ? 2.0 : (currentLH === 2.0 ? 2.5 : 1.6);
            contentEl.style.lineHeight = nextLH;
            saveCurrentContent(); showToast(`Jarak baris: ${nextLH}`);
        }

        function saveCurrentContent() {
            if (!currentActiveId || !isAdmin) return;
            const itemIndex = appData.findIndex(x => x.id === currentActiveId);
            if (itemIndex > -1) {
                appData[itemIndex].content = document.getElementById('detail-content').innerHTML;
                saveData(); 
            }
        }

        document.getElementById('detail-content').addEventListener('input', () => { if(isEditorActive) saveCurrentContent(); });

        // Fitur A- dan A+
        function changeFontSize(step) {
            baseFontSize += step;
            if(baseFontSize < 12) baseFontSize = 12;
            if(baseFontSize > 50) baseFontSize = 50;
            document.getElementById('detail-content').style.fontSize = baseFontSize + 'px';
        }

        // Fitur Scroll Otomatis (Memakai window.scrollBy)
        let scrollInterval, isScrolling = false;
        function toggleAutoScroll() {
            const btn = document.getElementById('btn-autoscroll');
            if (isScrolling) {
                clearInterval(scrollInterval); isScrolling = false;
                btn.classList.remove('text-gold-400');
            } else {
                isScrolling = true; btn.classList.add('text-gold-400');
                scrollInterval = setInterval(() => { window.scrollBy({ top: 1, left: 0, behavior: 'auto' }); }, 50);
            }
        }
        function stopAutoScroll() { if (isScrolling) toggleAutoScroll(); }

        // Fitur Anti Layar Mati
        let wakeLock = null;
        async function toggleWakeLock() {
            const btn = document.getElementById('btn-wakelock');
            if ('wakeLock' in navigator) {
                try {
                    if (wakeLock !== null) {
                        await wakeLock.release(); wakeLock = null;
                        btn.classList.remove('text-gold-400');
                    } else {
                        wakeLock = await navigator.wakeLock.request('screen');
                        btn.classList.add('text-gold-400');
                        wakeLock.addEventListener('release', () => { wakeLock = null; btn.classList.remove('text-gold-400'); });
                    }
                } catch (err) { showToast('Gagal mengaktifkan kunci layar.'); }
            } else { alert('Fitur layar selalu nyala tidak didukung HP ini.'); }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(()=>{});
            });
        }
    </script>
</body>
</html>
