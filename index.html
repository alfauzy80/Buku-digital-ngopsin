        function isMyMessage(msg) {
            if (msg.senderId) return msg.senderId === deviceId;
            return msg.name === chatName || (isAdmin && msg.isAdmin);
        }

        function updateChatBadge() {
            const badge = document.getElementById('chat-badge');
            if(!badge) return;
            if (unreadChatCount > 0) {
                badge.innerText = unreadChatCount > 99 ? '99+' : unreadChatCount;
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        function markChatAsRead() {
            unreadChatCount = 0;
            lastReadChatTime = Math.max(Date.now(), latestChatTimestamp);
            localStorage.setItem('ngopsinLastReadChat', lastReadChatTime.toString());
            updateChatBadge();
        }

        function playCustomSound() {
            try {
                const soundType = localStorage.getItem('ngopsinChatSound') || '1';
                if(soundType === '0') return; 

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if(!AudioContext) return;
                
                if(!window.chatAudioCtx) window.chatAudioCtx = new AudioContext();
                const ctx = window.chatAudioCtx;
                if(ctx.state === 'suspended') ctx.resume();

                const gain = ctx.createGain();
                gain.connect(ctx.destination);

                if (soundType === '1') { 
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                    osc.connect(gain); osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (soundType === '2') { 
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
                    osc.connect(gain); osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (soundType === '3') { 
                    const notes = [523.25, 659.25, 783.99]; 
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        const gainNode = ctx.createGain();
                        gainNode.connect(ctx.destination);
                        gainNode.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
                        gainNode.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.1 + 0.05);
                        gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.1 + 0.3);
                        osc.connect(gainNode); osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                    });
                }
            } catch(e) {}
        }

        function showSystemNotification(msg) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const safeName = (msg.name || 'Anonim').replace(/</g, "<").replace(/>/g, ">");
            const safeText = (msg.text || '').replace(/</g, "<").replace(/>/g, ">");
            const notifBody = msg.image ? "📷 Mengirim foto" : safeText;

            try {
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification("💬 " + safeName, { 
                            body: notifBody, 
                            icon: './icon-192.png', 
                            badge: './icon-192.png', 
                            tag: 'chat-buku-saku',
                            renotify: true,
                            silent: false,
                            vibrate: [200, 100, 200]
                        });
                    }).catch(() => {
                        new Notification("💬 " + safeName, { body: notifBody, icon: './icon-192.png' });
                    });
                } else {
                    new Notification("💬 " + safeName, { body: notifBody, icon: './icon-192.png' });
                }
            } catch (e) {}
        }

        function promptSoundSelect() {
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
            openModal({
                title: 'Pilih Suara Notifikasi',
                isInput: false,
                isPassword: false,
                isSelect: true,
                onConfirm: (val) => {
                    if(val) {
                        localStorage.setItem('ngopsinChatSound', val);
                        showToast('Suara Chat Disimpan!');
                        playCustomSound(); 
                    }
                }
            });
            setTimeout(() => document.getElementById('modal-select').value = localStorage.getItem('ngopsinChatSound') || '1', 50);
        }

        // ============ FITUR ADMIN: HAPUS SELURUH RIWAYAT CHAT ============
        function promptClearChat() {
            if (!isAdmin) return;
            openModal({
                title: 'Hapus Seluruh Riwayat Chat?',
                isInput: false,
                isPassword: false,
                isSelect: false,
                confirmText: 'Hapus',
                onConfirm: () => {
                    dbChatRef.remove()
                        .then(() => {
                            document.getElementById('chat-messages').innerHTML = '';
                            renderedMsgKeys.clear();
                            markChatAsRead();
                            showToast('Seluruh riwayat chat dihapus!');
                        })
                        .catch(() => showToast('Gagal menghapus riwayat chat.'));
                }
            });
        }

        function handleChatImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            showToast("Memproses gambar...");
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; 
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                    sendChatImage(base64Data);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function sendChatImage(base64Image) {
            if (!chatName && !isAdmin) {
                promptChatName();
                return;
            }
            
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            dbChatRef.push({
                name: chatName || (isAdmin ? 'Admin' : 'Anonim'),
                senderId: deviceId,
                text: '', 
                image: base64Image,
                time: timeString,
                isAdmin: isAdmin,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // ============ SISTEM PEMUATAN, BADGE & NOTIFIKASI CHAT REAL-TIME ============
        const chatQuery = dbChatRef.limitToLast(100);
        
        chatQuery.once('value', (snapshot) => {
            let latestUnreadMsg = null;

            snapshot.forEach(child => {
                const msg = child.val();
                if (!msg) return;
                renderedMsgKeys.add(child.key);
                renderChatMessage(msg, child.key);

                const msgTime = msg.timestamp || 0;
                if (msgTime > latestChatTimestamp) latestChatTimestamp = msgTime;

                if (!isMyMessage(msg) && msgTime > lastReadChatTime) {
                    const isChatOpen = document.getElementById('page-chat').classList.contains('active');
                    if (!isChatOpen) {
                        unreadChatCount++;
                        latestUnreadMsg = msg;
                    }
                }
            });

            if (unreadChatCount > 0) {
                updateChatBadge();
                playCustomSound();
                if (latestUnreadMsg) showSystemNotification(latestUnreadMsg);
            }

            initialChatLoaded = true;
            setTimeout(scrollToBottomChat, 100);
            
            chatQuery.on('child_added', (newSnapshot) => {
                if (renderedMsgKeys.has(newSnapshot.key)) return;
                renderedMsgKeys.add(newSnapshot.key);
                
                const msg = newSnapshot.val();
                if (!msg) return;
                renderChatMessage(msg, newSnapshot.key);

                const msgTime = msg.timestamp || Date.now();
                if (msgTime > latestChatTimestamp) latestChatTimestamp = msgTime;
                
                if (initialChatLoaded) {
                    const isChatOpen = document.getElementById('page-chat').classList.contains('active');
                    
                    if (!isMyMessage(msg)) {
                        if (!isChatOpen) {
                            unreadChatCount++;
                            updateChatBadge();
                        } else {
                            markChatAsRead();
                        }
                        
                        playCustomSound(); 
                        showSystemNotification(msg);
                    }
                }
            });
        });

        dbChatRef.on('child_removed', (oldSnapshot) => {
            renderedMsgKeys.delete(oldSnapshot.key);
            const msgEl = document.getElementById('chat-msg-' + oldSnapshot.key);
            if (msgEl) msgEl.remove();
            if (renderedMsgKeys.size === 0) {
                unreadChatCount = 0;
                updateChatBadge();
            }
        });

        function openChat() {
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }

            if (!chatName && !isAdmin) {
                promptChatName();
            } else {
                if(isAdmin && !chatName) chatName = "Admin";
                navigateTo('page-chat');
                updateAdminUI();
                markChatAsRead();
                
                setTimeout(scrollToBottomChat, 50);
            }
        }

        function promptChatName() {
            openModal({
                title: 'Nama Anda (Untuk Obrolan)',
                isInput: true,
                isPassword: false,
                isSelect: false,
                onConfirm: (val) => {
                    if (val && val.trim().length > 0) {
                        chatName = val.trim();
                        localStorage.setItem('ngopsinChatName', chatName);
                        showToast('Nama tersimpan!');
                        openChat(); 
                    } else {
                        showToast('Nama tidak boleh kosong!');
                    }
                }
            });
            setTimeout(() => document.getElementById('modal-input').value = chatName || '', 50);
        }

        function renderChatMessage(msg, key) {
            const isMe = isMyMessage(msg);
            const bubbleAlign = isMe ? 'justify-end' : 'justify-start';
            const bubbleColor = isMe ? 'bg-gold-500 text-black' : 'bg-black/50 border border-gold-500/30 text-slate-200';
            const adminBadge = msg.isAdmin ? '<i class="fas fa-check-circle text-[10px] ml-1 text-gold-500" title="Admin"></i>' : '';

            const safeName = (msg.name || 'Anonim').replace(/</g, "<").replace(/>/g, ">");
            
            let messageContent = '';
            if (msg.image) {
                messageContent = `<img src="${msg.image}" class="rounded-lg w-full max-w-[200px] max-h-[250px] object-cover mb-1 cursor-pointer shadow-sm border border-gold-500/30" onclick="openImageModal('${msg.image}')" alt="Foto">`;
                if (msg.text) {
                    const safeText = msg.text.replace(/</g, "<").replace(/>/g, ">");
                    messageContent += `<p class="text-[15px] font-sans whitespace-pre-wrap break-words mt-1">${safeText}</p>`;
                }
            } else {
                const safeText = (msg.text || '').replace(/</g, "<").replace(/>/g, ">");
                messageContent = `<p class="text-[15px] font-sans whitespace-pre-wrap break-words">${safeText}</p>`;
            }

            const html = `
                <div id="chat-msg-${key || ''}" class="flex w-full ${bubbleAlign}">
                    <div class="max-w-[80%] flex flex-col">
                        <span class="text-[10px] ${isMe ? 'text-right text-gold-500/70' : 'text-left text-slate-400'} mb-1 px-1">${safeName} ${adminBadge}</span>
                        <div class="${bubbleColor} px-3 py-2 rounded-2xl ${isMe ? 'rounded-tr-none' : 'rounded-tl-none'} shadow-md">
                            ${messageContent}
                        </div>
                        <span class="text-[9px] ${isMe ? 'text-right' : 'text-left'} text-slate-500 mt-1 px-1">${msg.time}</span>
                    </div>
                </div>
            `;
            document.getElementById('chat-messages').insertAdjacentHTML('beforeend', html);
            scrollToBottomChat();
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            dbChatRef.push({
                name: chatName || 'Anonim',
                senderId: deviceId,
                text: text,
                time: timeString,
                isAdmin: isAdmin,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
            input.focus();
        }

        function scrollToBottomChat() {
            const chatScroll = document.getElementById('chat-scroll-container');
            if (chatScroll) chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
