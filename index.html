        }

        function renderChatMessage(msg, key) {
            const isMe = isMyMessage(msg);
            const bubbleAlign = isMe ? 'justify-end' : 'justify-start';
            const bubbleColor = isMe ? 'bg-gold-500 text-black' : 'bg-black/50 border border-gold-500/30 text-slate-200';
            const adminBadge = msg.isAdmin ? '<i class="fas fa-check-circle text-[10px] ml-1 text-gold-500" title="Admin"></i>' : '';

            const safeName = (msg.name || 'Anonim').replace(/</g, "<").replace(/>/g, ">");
            
            let messageContent = '';
            if (msg.image) {
                messageContent = `<img src="${msg.image}" class="rounded-lg w-full max-w-[200px] max-h-[250px] object-cover mb-1 cursor-pointer shadow-sm border border-gold-500/30" onclick="openImageModal('${msg.image}')" alt="Foto">`;
                if (msg.text) {
                    const safeText = msg.text.replace(/</g, "<").replace(/>/g, ">");
                    messageContent += `<p class="text-[15px] font-sans whitespace-pre-wrap break-words mt-1">${safeText}</p>`;
                }
            } else {
                const safeText = (msg.text || '').replace(/</g, "<").replace(/>/g, ">");
                messageContent = `<p class="text-[15px] font-sans whitespace-pre-wrap break-words">${safeText}</p>`;
            }

            const html = `
                <div id="chat-msg-${key || ''}" class="flex w-full ${bubbleAlign}">
                    <div class="max-w-[80%] flex flex-col">
                        <span class="text-[10px] ${isMe ? 'text-right text-gold-500/70' : 'text-left text-slate-400'} mb-1 px-1">${safeName} ${adminBadge}</span>
                        <div class="${bubbleColor} px-3 py-2 rounded-2xl ${isMe ? 'rounded-tr-none' : 'rounded-tl-none'} shadow-md">
                            ${messageContent}
                        </div>
                        <span class="text-[9px] ${isMe ? 'text-right' : 'text-left'} text-slate-500 mt-1 px-1">${msg.time}</span>
                    </div>
                </div>
            `;
            document.getElementById('chat-messages').insertAdjacentHTML('beforeend', html);
            scrollToBottomChat();
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            dbChatRef.push({
                name: chatName || 'Anonim',
                senderId: deviceId,
                text: text,
                time: timeString,
                isAdmin: isAdmin,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
            input.focus();
        }

        function scrollToBottomChat() {
            const chatScroll = document.getElementById('chat-scroll-container');
            if (chatScroll) chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
        }
    </script>

    <!-- MODUL TERPISAH: JADWAL PENGAJIAN -->
    <script>
        const dbScheduleRef = database.ref('bukuSakuJadwal');
        let scheduleData = [];
        let editingScheduleId = null;

        function escapeScheduleText(str) {
            return String(str || '')
                .replace(/&/g, "&")
                .replace(/</g, "<")
                .replace(/>/g, ">")
                .replace(/"/g, """)
                .replace(/'/g, "'");
        }

        dbScheduleRef.on('value', (snapshot) => {
            const data = snapshot.val();
            scheduleData = data ? (Array.isArray(data) ? data.filter(i => i) : Object.values(data).filter(i => i)) : [];
            const pageEl = document.getElementById('page-schedule');
            if (pageEl && pageEl.classList.contains('active')) {
                renderSchedules();
            }
        }, () => {
            scheduleData = [];
            const pageEl = document.getElementById('page-schedule');
            if (pageEl && pageEl.classList.contains('active')) {
                renderSchedules();
            }
        });

        function saveSchedules() {
            dbScheduleRef.set(scheduleData).catch(() => showToast("Gagal menyimpan jadwal."));
        }

        function syncScheduleAdminUI() {
            const btnAddSchedule = document.getElementById('btn-add-schedule');
            if (btnAddSchedule) {
                btnAddSchedule.style.display = isAdmin ? 'inline-flex' : 'none';
            }
            const pageEl = document.getElementById('page-schedule');
            if (pageEl && pageEl.classList.contains('active')) {
                renderSchedules();
            }
        }

        function openSchedule() {
            navigateTo('page-schedule');
        }

        function openScheduleModal(id) {
            if (!isAdmin) return;
            editingScheduleId = id || null;
            const titleEl = document.getElementById('schedule-modal-title');
            const dayEl = document.getElementById('sched-day');
            const timeEl = document.getElementById('sched-time');
            const locEl = document.getElementById('sched-location');
            const agendaEl = document.getElementById('sched-agenda');

            if (editingScheduleId) {
                const item = scheduleData.find(x => x.id === editingScheduleId);
                if (!item) return;
                titleEl.innerText = 'Edit Jadwal Pengajian';
                dayEl.value = item.day || '';
                timeEl.value = item.time || '';
                locEl.value = item.location || '';
                agendaEl.value = item.agenda || '';
            } else {
                titleEl.innerText = 'Tambah Jadwal Pengajian';
                dayEl.value = '';
                timeEl.value = '';
                locEl.value = '';
                agendaEl.value = '';
            }

            const modal = document.getElementById('schedule-modal');
            if (modal) {
                modal.style.display = 'flex';
                setTimeout(() => dayEl.focus(), 100);
            }
        }

        function closeScheduleModal() {
            editingScheduleId = null;
            const modal = document.getElementById('schedule-modal');
            if (modal) modal.style.display = 'none';
        }

        function saveScheduleForm() {
            if (!isAdmin) return;
            const day = document.getElementById('sched-day').value.trim();
            const time = document.getElementById('sched-time').value.trim();
            const location = document.getElementById('sched-location').value.trim();
            const agenda = document.getElementById('sched-agenda').value.trim();

            if (!time || !location || !agenda) {
                showToast("Jam, lokasi, dan agenda wajib diisi!");
                return;
            }

            if (editingScheduleId) {
                const idx = scheduleData.findIndex(x => x.id === editingScheduleId);
                if (idx > -1) {
                    scheduleData[idx] = {
                        id: scheduleData[idx].id,
                        day: day || 'Jadwal Rutin',
                        time: time,
                        location: location,
                        agenda: agenda
                    };
                }
                showToast("Jadwal diperbarui!");
            } else {
                scheduleData.push({
                    id: Date.now(),
                    day: day || 'Jadwal Rutin',
                    time: time,
                    location: location,
                    agenda: agenda
                });
                showToast("Jadwal ditambahkan!");
            }

            saveSchedules();
            closeScheduleModal();
            renderSchedules();
        }

        function promptDeleteSchedule(id) {
            if (!isAdmin) return;
            openModal({
                title: 'Hapus Jadwal Pengajian Ini?',
                isInput: false,
                isPassword: false,
                isSelect: false,
                confirmText: 'Hapus',
                onConfirm: () => {
                    scheduleData = scheduleData.filter(x => x.id !== id);
                    saveSchedules();
                    showToast('Jadwal berhasil dihapus!');
                    renderSchedules();
                }
            });
        }

        function shareScheduleItem(id) {
            const item = scheduleData.find(x => x.id === id);
            if (!item) return;
            const shareText = "Jadwal Pengajian\nHari/Tanggal: " + (item.day || '-') + "\nJam Mulai: " + (item.time || '-') + "\nLokasi: " + (item.location || '-') + "\nAgenda: " + (item.agenda || '-');
            if (navigator.share) {
                navigator.share({
                    title: 'Jadwal Pengajian',
                    text: shareText
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                showToast("Info jadwal disalin!");
            }
        }

        function renderSchedules() {
            const container = document.getElementById('schedule-container');
            if (!container) return;
            container.innerHTML = '';

            if (!scheduleData || scheduleData.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-14 font-serif italic"><i class="fas fa-calendar-times text-3xl text-gold-500/40 mb-3 block"></i>Belum ada jadwal pengajian.</div>';
                return;
            }

            scheduleData.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'bg-royal-dark/60 border border-gold-500/20 p-4 rounded-xl shadow-md space-y-3';

                const adminBtns = isAdmin
                    ? '<button onclick="openScheduleModal(' + item.id + ')" class="p-1.5 text-gold-500/80 hover:text-gold-400 transition-colors" title="Edit Jadwal"><i class="fas fa-pen text-xs"></i></button>' +
                      '<button onclick="promptDeleteSchedule(' + item.id + ')" class="p-1.5 text-red-500/80 hover:text-red-400 transition-colors" title="Hapus Jadwal"><i class="fas fa-trash text-xs"></i></button>'
                    : '';

                card.innerHTML =
                    '<div class="flex items-start justify-between gap-2 border-b border-gold-500/15 pb-2.5">' +
                        '<div class="flex flex-wrap items-center gap-2">' +
                            '<span class="inline-flex items-center gap-1.5 bg-gold-500/15 border border-gold-500/30 text-gold-400 text-xs font-semibold px-2.5 py-1 rounded-full">' +
                                '<i class="fas fa-calendar-day text-[10px]"></i> ' + escapeScheduleText(item.day || 'Jadwal Rutin') +
                            '</span>' +
                            '<span class="inline-flex items-center gap-1.5 bg-black/40 border border-gold-500/20 text-slate-200 text-xs px-2.5 py-1 rounded-full">' +
                                '<i class="fas fa-clock text-gold-500 text-[10px]"></i> ' + escapeScheduleText(item.time) +
                            '</span>' +
                        '</div>' +
                        '<div class="flex items-center gap-1 flex-shrink-0">' +
                            '<button onclick="shareScheduleItem(' + item.id + ')" class="p-1.5 text-slate-400 hover:text-gold-400 transition-colors" title="Bagikan Jadwal">' +
                                '<i class="fas fa-share-nodes text-xs"></i>' +
                            '</button>' +
                            adminBtns +
                        '</div>' +
                    '</div>' +
                    '<div class="space-y-2 text-sm">' +
                        '<div class="flex items-start gap-2.5">' +
                            '<i class="fas fa-map-marker-alt text-gold-500 mt-1 w-4 text-center flex-shrink-0"></i>' +
                            '<div>' +
                                '<div class="text-[10px] uppercase tracking-wider text-slate-400">Lokasi</div>' +
                                '<div class="text-slate-100 font-medium">' + escapeScheduleText(item.location) + '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex items-start gap-2.5">' +
                            '<i class="fas fa-list-ul text-gold-500 mt-1 w-4 text-center flex-shrink-0"></i>' +
                            '<div>' +
                                '<div class="text-[10px] uppercase tracking-wider text-slate-400">Agenda Acara</div>' +
                                '<div class="text-slate-200 whitespace-pre-wrap leading-relaxed">' + escapeScheduleText(item.agenda) + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
