<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Buku Saku Digital - Premium Edition</title>
    
    <meta name="theme-color" content="#022c22">
    <link rel="apple-touch-icon" href="./logo.png">
    <link rel="preload" href="./logo.png" as="image">
    
    <!-- MANIFEST.JSON DIJADIKAN SATU DENGAN HTML -->
    <link id="manifest-link" rel="manifest" href="">
    <script>
        const manifestJSON = {
            "name": "Buku Saku Digital Ngopsin",
            "short_name": "Buku Saku",
            "description": "Buku saku digital dan kumpulan doa dengan sinkronisasi online.",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#022c22",
            "theme_color": "#064e3b",
            "icons": [
                {"src": "./icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
                {"src": "./logo.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/manifest+json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Amiri:wght@400;700&family=Lateef:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], serif: ['Playfair Display', 'serif'], arabic: ['Amiri', 'serif'] },
                    colors: { royal: { dark: '#022c22', base: '#064e3b' }, gold: { 400: '#facc15', 500: '#eab308' } }
                }
            }
        }
    </script>
    <style>
        html, body {
            margin: 0; padding: 0; 
            width: 100vw; height: 100dvh; 
            overflow: hidden; /* Mengunci total scroll body */
            background: radial-gradient(ellipse at top, #064e3b, #022c22, #000000); 
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent; 
        }

        /* STRUKTUR UTAMA */
        .app-container {
            width: 100%; height: 100%;
            max-width: 28rem;
            margin: 0 auto;
            position: relative;
        }

        /* SEMUA HALAMAN DI SET ABSOLUTE */
        .page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            background: radial-gradient(ellipse at top, #064e3b, #022c22, #000000); 
        }
        .page.active { display: flex; }

        /* HEADER FIXED (Anti-Scroll & Anti-Hilang) */
        .fixed-header {
            position: absolute; /* Terkunci ke app-container */
            top: 0; left: 0; right: 0;
            background: rgba(2, 44, 34, 0.95);
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        /* AREA SCROLL KONTEN */
        .scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1.5rem;
            padding-bottom: 50vh;
        }

        /* Menyesuaikan padding konten agar tidak tertutup header fixed */
        #page-toc .scroll-area { padding-top: 5rem; }
        #page-detail .scroll-area { padding-top: 9rem; }
        
        .content-area { outline: none; min-height: 100%; }
        .content-area[contenteditable="true"]:focus { 
            border: 1px dashed rgba(234, 179, 8, 0.5); 
            border-radius: 8px; padding: 8px; background: rgba(255,255,255,0.02); 
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }
    </style>
</head>
<body class="selection:bg-gold-500 selection:text-royal-dark font-sans relative">

    <div class="app-container">
        
        <!-- TOAST & BANNER PWA -->
        <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-royal-dark border border-gold-500 text-gold-400 px-6 py-2 rounded-full shadow-lg z-[1000] opacity-0 pointer-events-none transition-opacity duration-300 font-semibold text-sm">Pesan</div>

        <div id="install-banner" class="fixed bottom-0 left-0 w-full bg-royal-dark/95 backdrop-blur border-t border-gold-500/50 p-4 hidden flex-row justify-between items-center z-[2000] shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
            <div class="flex items-center gap-3">
                <img src="./icon-192.png" onerror="this.src='./logo.png'" alt="Icon" class="w-12 h-12 rounded-xl shadow-md border border-gold-500/30">
                <div>
                    <p class="text-gold-400 font-bold text-[15px] leading-tight">Buku Saku Digital</p>
                    <p class="text-xs text-slate-300 mt-0.5">Install aplikasi ke perangkat Anda</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-install" class="bg-gradient-to-r from-gold-500 to-gold-400 text-black px-4 py-2 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform">Install</button>
                <button onclick="document.getElementById('install-banner').classList.replace('flex','hidden')" class="text-slate-400 p-2 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- MODAL -->
        <div id="custom-modal" class="fixed inset-0 bg-black/80 z-[1000] hidden items-center justify-center px-4 backdrop-blur-sm">
            <div class="bg-royal-dark border border-gold-500/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <h3 id="modal-title" class="text-xl font-serif text-gold-400 mb-4">Judul</h3>
                <div class="relative w-full mb-6" id="modal-input-container">
                    <input type="text" id="modal-input" class="w-full px-4 py-3 bg-black/50 border border-gold-500/50 rounded-lg outline-none text-white focus:border-gold-400">
                    <button id="modal-eye-btn" class="absolute right-4 top-3.5 text-slate-400 hidden" onclick="toggleModalPassword()"><i class="fas fa-eye-slash" id="modal-eye-icon"></i></button>
                </div>
                <div class="flex justify-end gap-3">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:text-white">Batal</button>
                    <button id="btn-modal-confirm" class="px-5 py-2 bg-gradient-to-r from-gold-500 to-gold-400 text-black font-bold rounded-lg shadow-md">Simpan</button>
                </div>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- HALAMAN 1: COVER -->
        <!-- ============================================== -->
        <div id="page-cover" class="page active px-6">
            <div class="flex-grow w-full flex items-center justify-center pt-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-gold-500 blur-[40px] opacity-25 rounded-full scale-110"></div>
                    <img src="./logo.png" alt="Logo" class="w-44 h-44 object-cover relative z-10 rounded-full border-2 border-gold-500/50 shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                </div>
            </div>
            
            <div class="flex-none flex flex-col items-center justify-center pb-24 w-full relative z-20 text-center">
                <h1 class="text-5xl font-serif font-bold text-gold-400 mb-4 tracking-wide drop-shadow-md">Buku Saku</h1>
                <div class="flex items-center gap-3 mb-4">
                    <div class="h-px w-12 bg-gradient-to-r from-transparent to-gold-500"></div>
                    <i class="fas fa-gem text-gold-500 text-[10px]"></i>
                    <div class="h-px w-12 bg-gradient-to-l from-transparent to-gold-500"></div>
                </div>
                <h2 class="text-xs text-slate-300 tracking-[0.2em] uppercase mb-12">Ngopsin Mabu Park</h2>
                
                <button onclick="navigateTo('page-toc')" class="border border-gold-500 text-gold-400 font-serif italic py-3 px-10 rounded-full hover:bg-gold-500 hover:text-black transition-colors flex items-center gap-3 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                    Buka Kitab <i class="fas fa-book-open text-sm"></i>
                </button>
            </div>

            <div class="absolute bottom-8 w-full text-center z-20 left-0">
                <button onclick="promptAdminLogin()" class="p-3 text-slate-600 hover:text-gold-500 transition-colors">
                    <i id="admin-icon" class="fas fa-lock text-sm"></i>
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- HALAMAN 2: DAFTAR ISI -->
        <!-- ============================================== -->
        <div id="page-toc" class="page">
            <header class="fixed-header p-4 flex justify-between items-center">
                <button onclick="navigateTo('page-cover')" class="text-gold-500 text-xl"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-serif font-bold text-gold-400 tracking-widest">DAFTAR ISI</h1>
                <div class="w-6"></div>
            </header>
            <main class="scroll-area">
                <div class="flex justify-end mb-6">
                    <button id="btn-add-toc" onclick="promptNewToc()" class="hidden bg-gold-500 text-black font-bold rounded-full px-4 py-1.5 shadow-md text-sm"><i class="fas fa-plus mr-1"></i>Tambah</button>
                </div>
                <div id="toc-container" class="space-y-3">
                    <div class="text-center text-gold-500 py-10 font-serif animate-pulse">Memuat...</div>
                </div>
            </main>
        </div>

        <!-- ============================================== -->
        <!-- HALAMAN 3: KONTEN (DETAIL & EDIT) -->
        <!-- ============================================== -->
        <div id="page-detail" class="page">
            
            <!-- HEADER YANG BENAR-BENAR TERKUNCI -->
            <div class="fixed-header">
                <!-- Baris 1: Judul -->
                <div class="flex justify-between items-center p-3 border-b border-gold-500/20">
                    <button onclick="navigateTo('page-toc')" class="text-gold-400 text-xl px-2"><i class="fas fa-arrow-left"></i></button>
                    <h1 id="detail-title" class="font-serif font-bold text-gold-400 truncate max-w-[200px]" ondblclick="if(isAdmin) promptEditTitle()">Judul</h1>
                    <button id="btn-edit-mode" onclick="toggleEditor()" class="text-slate-500 hidden px-2"><i id="edit-icon" class="fas fa-pen"></i></button>
                </div>

                <!-- Baris 2: Menu BACA -->
                <div id="reader-features" class="flex overflow-x-auto gap-2 p-2 no-scrollbar border-b border-gold-500/20 items-center bg-black/20">
                    <button onclick="changeGlobalFontSize(-2)" class="px-3 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">A-</button>
                    <button onclick="changeGlobalFontSize(2)" class="px-3 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">A+</button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    <button onclick="toggleWakeLock()" id="btn-wakelock" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-lightbulb text-gold-500"></i> Layar</button>
                    <button onclick="toggleAutoScroll()" id="btn-autoscroll" class="px-3 py-1 bg-royal-dark text-slate-300 rounded border border-gold-500/30 flex items-center gap-1 flex-shrink-0 text-sm"><i class="fas fa-angle-double-down text-gold-500"></i> Scroll</button>
                </div>

                <!-- Baris 2: Menu EDIT ADMIN -->
                <!-- ontouchstart="event.preventDefault()" untuk mencegah keyboard hilang/fokus berpindah -->
                <div id="admin-features" class="hidden overflow-x-auto gap-1.5 p-2 no-scrollbar items-center bg-black/40 border-b border-gold-500/30 shadow-inner" ontouchstart="event.preventDefault()">
                    
                    <!-- FONT SIZE DENGAN INDIKATOR -->
                    <div class="flex items-center bg-royal-dark border border-gold-500/30 rounded flex-shrink-0">
                        <button onclick="changeSelectedFontSize(-1)" class="px-2.5 py-1 text-gold-400 font-bold text-sm">A-</button>
                        <div class="w-px h-5 bg-gold-500/20"></div>
                        <!-- KETERANGAN PX -->
                        <span id="font-size-display" class="text-xs text-gold-400 w-12 text-center font-mono font-bold">22px</span>
                        <div class="w-px h-5 bg-gold-500/20"></div>
                        <button onclick="changeSelectedFontSize(1)" class="px-2.5 py-1 text-gold-400 font-bold text-sm">A+</button>
                    </div>
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>

                    <button onclick="execCmd('undo')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0"><i class="fas fa-undo text-xs"></i></button>
                    <button onclick="execCmd('redo')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0"><i class="fas fa-redo text-xs"></i></button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>

                    <button onclick="execCmd('bold')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 font-bold text-sm">B</button>
                    <button onclick="execCmd('italic')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 italic text-sm">I</button>
                    <button onclick="execCmd('underline')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 underline text-sm">U</button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    
                    <button onclick="execCmd('justifyLeft')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0"><i class="fas fa-align-left text-xs"></i></button>
                    <button onclick="execCmd('justifyCenter')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0"><i class="fas fa-align-center text-xs"></i></button>
                    <button onclick="execCmd('justifyRight')" class="w-8 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0"><i class="fas fa-align-right text-xs"></i></button>
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    
                    <select onchange="changeFontFamily(this.value); this.selectedIndex=0;" class="px-1 py-1 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 text-sm outline-none w-20">
                        <option value="" disabled selected>Font</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Amiri">Amiri</option>
                        <option value="Lateef">Lateef</option>
                        <option value="Playfair Display">Playfair</option>
                    </select>

                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-0.5"></div>
                    <button onclick="changeLineHeight()" class="px-2 h-8 bg-royal-dark text-gold-400 rounded border border-gold-500/30 flex-shrink-0 flex items-center gap-1 text-xs"><i class="fas fa-text-height"></i> Spasi</button>
                    
                    <input type="color" oninput="changeColor(this.value)" onchange="changeColor(this.value)" class="w-8 h-8 p-0 ml-1 border-0 rounded bg-transparent cursor-pointer flex-shrink-0" title="Warna">
                    
                    <div class="w-px h-5 bg-gold-500/20 flex-shrink-0 mx-1"></div>
                    <button onclick="promptDeleteCurrent()" class="w-8 h-8 bg-red-900/80 text-red-400 rounded border border-red-500/30 flex-shrink-0"><i class="fas fa-trash text-xs"></i></button>
                </div>
            </div>

            <!-- TEKS KONTEN -->
            <div class="scroll-area">
                <div id="detail-content" class="content-area text-xl font-arabic" style="color: #facc15;" contenteditable="false" onblur="saveCurrentContent()"></div>
            </div>
        </div>
    </div> <!-- End app-container -->

    <script>
        // ============ SISTEM FIREBASE ============
        const firebaseConfig = { apiKey: "AIzaSyA40Q6eOPK5vKAq-q9w6OhoCTtanb6GlHI", authDomain: "buku-digital-ngopsin.firebaseapp.com", databaseURL: "https://buku-digital-ngopsin-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "buku-digital-ngopsin", storageBucket: "buku-digital-ngopsin.firebasestorage.app", messagingSenderId: "80687588401", appId: "1:80687588401:web:5bcfcbb2a3398556b16110" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('bukuSakuData');

        let appData = [], isAdmin = false, currentActiveId = null, isEditorActive = false, baseFontSize = 22;
        let savedRange = null;

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            appData = data ? (Array.isArray(data) ? data.filter(i=>i) : Object.values(data).filter(i=>i)) : [];
            if (appData.length === 0) {
                appData = [{ id: 1, title: 'Mukadimah', content: '<div style="text-align: center;"><b style="font-family: \'Playfair Display\'; color: #facc15;">Bismillahirrohmanirrohim</b><br><br>Selamat datang di Buku Saku Digital.</div>' }];
                saveData(); 
            }
            if (document.getElementById('page-toc').classList.contains('active')) renderToc();
            if (document.getElementById('page-detail').classList.contains('active') && !isEditorActive && currentActiveId) openDetail(currentActiveId);
        });

        // ============ PWA INSTALL & UPDATE ============
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBanner = document.getElementById('install-banner');
            installBanner.classList.remove('hidden');
            installBanner.classList.add('flex');
        });

        document.getElementById('btn-install').addEventListener('click', async () => {
            const installBanner = document.getElementById('install-banner');
            installBanner.classList.replace('flex', 'hidden');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((registration) => {
                    registration.update();
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showToast("Pembaruan Sistem Tersedia! Memuat ulang...");
                                setTimeout(() => window.location.reload(), 2000);
                            }
                        });
                    });
                }).catch(()=>{});
            });
            let refreshing;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }

        // ============ UI & NAVIGASI ============
        function saveData() { dbRef.set(appData).catch(() => showToast("Gagal menyimpan.")); }
        
        function showToast(msg) {
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        let modalCallback = null;
        function openModal({ title, isInput, isPassword, onConfirm }) {
            document.getElementById('modal-title').innerText = title;
            const inputEl = document.getElementById('modal-input');
            inputEl.value = ''; inputEl.type = isPassword ? 'password' : 'text';
            document.getElementById('modal-input-container').style.display = isInput ? 'block' : 'none';
            document.getElementById('modal-eye-btn').style.display = isPassword ? 'block' : 'none';
            modalCallback = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden'); document.getElementById('custom-modal').classList.add('flex');
            if(isInput) setTimeout(() => inputEl.focus(), 100);
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); document.getElementById('custom-modal').classList.remove('flex'); }
        function toggleModalPassword() {
            const inp = document.getElementById('modal-input'), icn = document.getElementById('modal-eye-icon');
            if(inp.type === 'password') { inp.type = 'text'; icn.className = 'fas fa-eye'; } 
            else { inp.type = 'password'; icn.className = 'fas fa-eye-slash'; }
        }
        document.getElementById('btn-modal-confirm').addEventListener('click', () => { if(modalCallback) modalCallback(document.getElementById('modal-input').value); closeModal(); });

        function promptAdminLogin() {
            if(isAdmin) {
                isAdmin = false; showToast("Admin Logout.");
                document.getElementById('admin-icon').className = 'fas fa-lock text-sm'; document.getElementById('admin-icon').parentElement.classList.replace('text-gold-500', 'text-slate-600'); return;
            }
            openModal({ title: 'Sandi Admin', isInput: true, isPassword: true, onConfirm: (val) => {
                if(val === 'ngopsinoznet') {
                    isAdmin = true; showToast("Akses Terbuka!");
                    document.getElementById('admin-icon').className = 'fas fa-unlock text-sm'; document.getElementById('admin-icon').parentElement.classList.replace('text-slate-600', 'text-gold-500');
                } else showToast("Sandi Salah!");
            }});
        }

        function navigateTo(pageId) {
            ['page-cover', 'page-toc', 'page-detail'].forEach(id => { 
                document.getElementById(id).classList.remove('active'); 
            });
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'page-toc') renderToc();
        }

        function renderToc() {
            const container = document.getElementById('toc-container'); container.innerHTML = '';
            document.getElementById('btn-add-toc').style.display = isAdmin ? 'block' : 'none';
            appData.forEach((item, index) => {
                if(!item) return;
                const btn = document.createElement('div');
                btn.className = 'bg-royal-dark/60 border border-gold-500/20 p-4 rounded-xl shadow-md flex items-center justify-between cursor-pointer hover:bg-royal-base';
                btn.onclick = () => openDetail(item.id);
                btn.innerHTML = `<div class="flex items-center"><div class="w-8 h-8 rounded-full bg-gold-500/10 text-gold-400 flex items-center justify-center font-bold text-sm mr-3 border border-gold-500/30">${index+1}</div><span class="font-serif text-slate-100">${(item.title||'').replace(/^\d+[\.\-]?\s*/, '')}</span></div><i class="fas fa-chevron-right text-gold-500/50 text-xs"></i>`;
                container.appendChild(btn);
            });
        }

        function promptNewToc() {
            openModal({ title: 'Tambah Doa', isInput: true, onConfirm: (val) => {
                if(val) { appData.push({ id: Date.now(), title: val, content: '<div style="text-align:center;">Ketik di sini...</div>' }); saveData(); showToast('Ditambahkan!'); }
            }});
        }

        function openDetail(id) {
            currentActiveId = id; const item = appData.find(x => x.id === id); if(!item) return;
            document.getElementById('detail-title').innerText = (item.title||'').replace(/^\d+[\.\-]?\s*/, '');
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = item.content || ""; contentEl.style.fontSize = baseFontSize + 'px';
            if(contentEl.dataset.lh) changeLineHeightGlobal(contentEl.dataset.lh);
            document.getElementById('btn-edit-mode').style.display = isAdmin ? 'block' : 'none';
            isEditorActive = false;
            document.getElementById('reader-features').classList.replace('hidden', 'flex');
            document.getElementById('admin-features').classList.replace('flex', 'hidden');
            document.getElementById('edit-icon').className = 'fas fa-pen';
            document.getElementById('btn-edit-mode').classList.replace('text-gold-400', 'text-slate-500');
            contentEl.setAttribute('contenteditable', 'false');
            navigateTo('page-detail');
        }

        function toggleEditor() {
            isEditorActive = !isEditorActive;
            const rBar = document.getElementById('reader-features'), aBar = document.getElementById('admin-features'), contentEl = document.getElementById('detail-content'), btnEdit = document.getElementById('btn-edit-mode'), iconEdit = document.getElementById('edit-icon');
            if (isEditorActive) {
                rBar.classList.replace('flex', 'hidden'); aBar.classList.replace('hidden', 'flex');
                iconEdit.className = 'fas fa-save'; btnEdit.classList.replace('text-slate-500', 'text-gold-400');
                contentEl.setAttribute('contenteditable', 'true'); 
                contentEl.focus(); showToast("Mode Edit.");
            } else {
                aBar.classList.replace('flex', 'hidden'); rBar.classList.replace('hidden', 'flex');
                iconEdit.className = 'fas fa-pen'; btnEdit.classList.replace('text-gold-400', 'text-slate-500');
                contentEl.setAttribute('contenteditable', 'false'); saveCurrentContent(); showToast("Tersimpan.");
            }
        }

        // ==========================================
        // SISTEM SELEKSI KETAT & ANTI LOMPAT
        // ==========================================
        const editorContent = document.getElementById('detail-content');

        // Update indikator PX saat teks disorot
        function updateFontSizeDisplay() {
            if(!savedRange || !isEditorActive) return;
            let node = savedRange.startContainer;
            let parentEl = node.nodeType === 3 ? node.parentElement : node;
            if(parentEl) {
                let size = window.getComputedStyle(parentEl).fontSize;
                document.getElementById('font-size-display').innerText = parseInt(size) + 'px';
            }
        }

        // Simpan posisi seleksi secara pasif
        document.addEventListener('selectionchange', () => {
            if (!isEditorActive) return;
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editorContent.contains(range.commonAncestorContainer)) {
                    savedRange = range.cloneRange();
                    if(!range.collapsed) updateFontSizeDisplay();
                }
            }
        });

        // Trik restorasi TANPA focus() agar layar tidak lompat ke bawah
        function restoreSelectionSilently() {
            if (savedRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
                return sel;
            }
            return window.getSelection();
        }

        // ============ FUNGSI EDIT MENU ============
        function execCmd(command, value = null) {
            restoreSelectionSilently(); 
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            document.execCommand('styleWithCSS', false, true);
            document.execCommand(command, false, value);
            saveCurrentContent();
        }

        function changeColor(color) {
            if(!color) return;
            restoreSelectionSilently(); 
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, color);
            saveCurrentContent();
        }

        function changeFontFamily(fontName) {
            if(!fontName) return;
            restoreSelectionSilently();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('fontName', false, fontName);
            
            editorContent.querySelectorAll('font[face]').forEach(el => {
                el.style.fontFamily = el.getAttribute('face');
                el.removeAttribute('face');
            });
            saveCurrentContent();
        }

        function changeSelectedFontSize(step) {
            restoreSelectionSilently();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");

            let node = savedRange.startContainer;
            let parentEl = node.nodeType === 3 ? node.parentElement : node;
            
            let currentSize = parseInt(window.getComputedStyle(parentEl).fontSize) || 22;
            let newSize = currentSize + step;
            if (newSize < 8) newSize = 8;
            if (newSize > 40) newSize = 40;

            document.execCommand("styleWithCSS", false, false);
            document.execCommand("fontSize", false, "7");
            
            let modified = false;
            editorContent.querySelectorAll('font[size="7"]').forEach(f => {
                f.removeAttribute('size');
                f.style.fontSize = newSize + 'px';
                modified = true;
            });
            
            editorContent.querySelectorAll('*').forEach(el => {
                let fs = el.style.fontSize;
                if(fs === '-webkit-xxx-large' || fs === 'xx-large' || fs === '48px' || el.getAttribute('size') === '7') {
                    el.style.fontSize = newSize + 'px';
                    el.removeAttribute('size');
                    modified = true;
                }
            });

            document.execCommand("styleWithCSS", false, true);
            document.getElementById('font-size-display').innerText = newSize + 'px';
            saveCurrentContent();
        }

        function changeLineHeight() {
            restoreSelectionSilently();
            if (!savedRange || savedRange.collapsed) return showToast("Tandai (drag) teks dulu!");
            
            const lhSequence = [1.0, 1.5, 2.0, 2.5, 3.0]; 
            
            // Perbaikan Spasi: Mencari wadah blok utama agar tidak memecah baris inline
            let node = savedRange.commonAncestorContainer;
            let blockNode = node.nodeType === 3 ? node.parentElement : node;
            
            // Paksa naik ke level div jika tersangkut di elemen format (B, I, SPAN)
            while (blockNode && blockNode.id !== 'detail-content' && !['DIV', 'P'].includes(blockNode.tagName)) {
                blockNode = blockNode.parentElement;
            }
            if (!blockNode) blockNode = editorContent;

            let currentInline = parseFloat(blockNode.style.lineHeight) || parseFloat(blockNode.dataset.lh) || 2.0;
            let nextIndex = lhSequence.indexOf(currentInline) + 1;
            if (nextIndex >= lhSequence.length || nextIndex < 0) nextIndex = 0;
            
            let newLH = lhSequence[nextIndex];
            blockNode.style.lineHeight = newLH;
            blockNode.dataset.lh = newLH; 
            
            showToast(`Spasi Paragraf: ${newLH}`);
            saveCurrentContent();
        }

        // ============ FITUR BACA ===========
        function changeGlobalFontSize(step) {
            baseFontSize += step; 
            if(baseFontSize < 14) baseFontSize = 14; 
            if(baseFontSize > 60) baseFontSize = 60;
            
            editorContent.style.fontSize = baseFontSize + 'px';
            editorContent.querySelectorAll('*').forEach(el => {
                if(el.style.fontSize) {
                    let current = parseInt(el.style.fontSize);
                    if(current) {
                        let ns = current + step;
                        if(ns < 8) ns = 8; if(ns > 60) ns = 60;
                        el.style.fontSize = ns + 'px';
                    }
                }
            });
            saveCurrentContent();
        }

        function changeLineHeightGlobal(lh) {
            editorContent.dataset.lh = lh;
            let styleTag = document.getElementById('force-line-height');
            if(!styleTag) { styleTag = document.createElement('style'); styleTag.id = 'force-line-height'; document.head.appendChild(styleTag); }
            styleTag.innerHTML = `#detail-content, #detail-content * { line-height: ${lh} !important; }`;
        }

        function saveCurrentContent() {
            if(!currentActiveId || !isAdmin) return;
            const itemIndex = appData.findIndex(x => x.id === currentActiveId);
            if(itemIndex > -1) { appData[itemIndex].content = editorContent.innerHTML; saveData(); }
        }
        editorContent.addEventListener('input', () => { if(isEditorActive) saveCurrentContent(); });

        function promptEditTitle() {
            if(!isEditorActive) return showToast("Aktifkan mode edit.");
            const item = appData.find(x => x.id === currentActiveId); if(!item) return;
            openModal({ title: 'Ubah Judul', isInput: true, onConfirm: (val) => {
                if(val){ item.title = val; document.getElementById('detail-title').innerText = val; saveData(); showToast('Berhasil diubah!'); }
            }});
            setTimeout(() => document.getElementById('modal-input').value = item.title, 50);
        }
        function promptDeleteCurrent() {
            openModal({ title: 'Hapus Halaman?', isInput: false, onConfirm: () => {
                appData = appData.filter(x => x.id !== currentActiveId); saveData(); navigateTo('page-toc'); showToast('Dihapus!');
            }});
        }

        let scrollInterval, isScrolling = false;
        function toggleAutoScroll() {
            const btn = document.getElementById('btn-autoscroll'), container = document.querySelector('#page-detail .scroll-area');
            if (isScrolling) { clearInterval(scrollInterval); isScrolling = false; btn.classList.replace('text-gold-400', 'text-slate-300'); } 
            else { isScrolling = true; btn.classList.replace('text-slate-300', 'text-gold-400'); scrollInterval = setInterval(() => { container.scrollBy({ top: 1, left: 0, behavior: 'auto' }); }, 50); }
        }

        let wakeLock = null;
        async function toggleWakeLock() {
            const btn = document.getElementById('btn-wakelock');
            if ('wakeLock' in navigator) {
                try {
                    if (wakeLock) { await wakeLock.release(); wakeLock = null; btn.classList.replace('text-gold-400', 'text-slate-300'); } 
                    else { wakeLock = await navigator.wakeLock.request('screen'); btn.classList.replace('text-slate-300', 'text-gold-400'); wakeLock.addEventListener('release', () => { wakeLock = null; btn.classList.replace('text-gold-400', 'text-slate-300'); }); }
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
